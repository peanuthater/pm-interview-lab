AI 搜索功能的成功」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。"], "detail": "先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "metrics": "北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Value", "AI search creates value when a user gets a correct, useful answer faster and with less effort than clicking through 10 links. The moment of value is 'my question is answered and I trust the answer enough to act on it.'"], ["North Star", "'Weekly successful search sessions': sessions where the user gets an AI answer and doesn't need to rephrase the query or go to another search engine within a few minutes, and doesn't give negative feedback. I'd validate this definition with human ratings on a sample, so we know it tracks real satisfaction."], ["Driver Tree", "Successful sessions = searches × AI answer coverage (share of queries where we show an answer) × answer quality × user trust. Answer quality breaks into factual accuracy, citation validity (the source really supports the claim) and completeness. Trust shows up as follow-up questions, copying the answer, or clicking a citation and staying."], ["Guardrails", "Hallucination rate from weekly sampled reviews, P95 latency (users expect search to be instant), cost per query, negative feedback rate, and traffic sent to publishers if our content ecosystem depends on them."], ["Segments", "By query type: facts, how-to, comparisons, local, and sensitive topics like health or finance where the accuracy bar is higher. By user: new versus repeat. A rising North Star should hold across query types, not just easy fact lookups."]], "followup": "AI 搜索的点击率可能下降，因为用户直接看到答案了，你怎么向团队解释这个变化？", "followupAnswer": "In AI search, fewer clicks can mean success: the answer met the need without the user leaving. So I'd move the team away from click rate as a primary metric and toward task success: did the user stop searching, rate the answer well, or take a next step like asking a follow-up? I'd show this with data: compare sessions with and without AI answers on re-search rate and satisfaction. I'd keep clicks on cited sources as a secondary signal for trust, because users who verify sources are engaged. And for the ecosystem, I'd track traffic to publishers as a guardrail."}, {"id": 25, "category": "指标体系 Metrics", "question": "如何衡量 B2B SaaS onboarding 成功", "english": "Measure B2B SaaS onboarding", "frameworkEN": "Value → North Star → Driver Tree → Guardrails → Segments", "frameworkZH": "定义用户获得的核心价值 → 北极星指标 → 拆分可行动的驱动指标 → 护栏指标 → 分群与埋点", "steps": ["1. 框定问题 / Frame: 针对「如何衡量 B2B SaaS onboarding 成功」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。"], "detail": "先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "metrics": "北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Value", "B2B onboarding succeeds when a new customer reaches their first meaningful outcome, like their first automated report or first workflow run on real data, and then the wider team starts using it. Signing up is not value; getting a result is."], ["North Star", "'Share of new accounts reaching activation within 30 days.' I'd define activation from data: compare accounts that renewed with ones that churned, and find the early actions that predict renewal best, for example '3 or more users active and the core workflow run 5 times on real data.'"], ["Driver Tree", "Activation = sign ups × setup completion (data connected, integrations set up) × first value event × team expansion (invites sent and accepted). Time to value sits across all steps: if connecting data takes 2 weeks, every later step suffers. Each driver can have a clear owner, such as the integrations team for setup."], ["Guardrails", "Support tickets per new account, implementation hours from customer success (onboarding that needs heavy human help won't scale), setup error rates, and trial to paid conversion."], ["Segments", "Self-serve versus sales-led accounts, company size, plan and industry. A 10-person team and a 2,000-person enterprise activate differently, so I'd report activation per segment and set targets for each."]], "followup": "你会如何确定“激活”的定义？如果不同类型客户的激活行为不一样怎么办？", "followupAnswer": "I'd look at historical data: compare accounts that renewed with ones that churned, and find early actions in the first 30 days that best predict renewal. I'd test a few candidate definitions and pick one that is predictive, simple to understand and something the product team can influence. If customer types behave differently, I'd define activation per segment, for example a small team might activate with one workflow, while an enterprise needs integrations and several departments. I'd keep a single top-line metric, 'activated accounts', but allow segment-specific definitions under it."}, {"id": 26, "category": "指标体系 Metrics", "question": "如何衡量 Instagram Reels 的成功", "english": "Measure Instagram Reels success", "frameworkEN": "Value → North Star → Driver Tree → Guardrails → Segments", "frameworkZH": "定义用户获得的核心价值 → 北极星指标 → 拆分可行动的驱动指标 → 护栏指标 → 分群与埋点", "steps": ["1. 框定问题 / Frame: 针对「如何衡量 Instagram Reels 的成功」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。"], "detail": "先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "metrics": "北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Value", "Reels creates value for three groups: viewers get entertaining short videos, creators get reach and followers, and Instagram gets time spent, ad inventory and a defense against TikTok."], ["North Star", "'Daily engaged Reels watch time': watch time from sessions where the user also likes, shares, comments or follows. Pure watch time can reward mindless scrolling and low quality content, so adding engagement signals points the team toward content people actually value."], ["Driver Tree", "Engaged watch time = Reels viewers × sessions per viewer × Reels per session × average watch duration × engagement rate. The supply side matters too: number of creators posting weekly, and share of new Reels that reach good completion rates. Shares sent through DMs are an important driver, because they connect Reels to Instagram's social core."], ["Guardrails", "Time spent in Feed, Stories and DMs (to catch cannibalization), user-reported regret or wellbeing surveys, teen safety metrics, creator churn, and ad load satisfaction."], ["Segments", "Viewers versus creators, age groups (teens need extra protection), new versus long-term users, and regions where TikTok is or isn't available, since behavior differs a lot."]], "followup": "如果 Reels 时长增长了，但 Stories 和私信活动下降，你如何判断整体是好是坏？", "followupAnswer": "I'd look at whether it's healthy substitution or harmful cannibalization. Stories and DMs build social connection, which drives long-term retention. Reels is more entertainment. I'd check total time spent, retention over 3 to 6 months, and especially how many users are sharing Reels in DMs. If Reels sharing is increasing DMs, that's good. If social activity falls and long-term retention drops, it's a warning sign. I'd test tweaks like more friend content in Reels, and treat Stories and DMs as guardrails for any Reels growth experiment."}, {"id": 27, "category": "指标体系 Metrics", "question": "如何衡量电商收藏夹的成功", "english": "Measure ecommerce wishlist success", "frameworkEN": "Value → North Star → Driver Tree → Guardrails → Segments", "frameworkZH": "定义用户获得的核心价值 → 北极星指标 → 拆分可行动的驱动指标 → 护栏指标 → 分群与埋点", "steps": ["1. 框定问题 / Frame: 针对「如何衡量电商收藏夹的成功」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。"], "detail": "先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "metrics": "北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Value", "A wishlist lets shoppers save items they're not ready to buy, then come back when the time, price or budget is right. For the business, it converts delayed intent into purchases and gives strong signals for recommendations, restocking and price alerts."], ["North Star", "'Purchases of wishlisted items within 30 days of saving.' It ties the feature to real purchases, not just a longer list. I'd also measure incrementality, since some of those purchases would have happened anyway."], ["Driver Tree", "Wishlist purchases = users who save items × items saved per user × return visits to the list × conversion of saved items. Levers for each: easy save button on product pages, price drop and low stock alerts, reminders at the right time, and a list that's easy to reach from the home page and cart."], ["Guardrails", "Overall conversion rate (the wishlist might delay purchases that would have happened right away), notification opt-out rate, and customer satisfaction with alerts. Also check discount costs if price drop alerts push users toward promotions."], ["Segments", "Category (high-price items like furniture get saved more), new versus loyal customers, device, and gift lists versus personal lists, which follow different timing like holidays."]], "followup": "收藏夹可能只是让用户“推迟购买”，你怎么判断它带来的是增量还是只是转移？", "followupAnswer": "I'd use a holdout experiment: a random group without the wishlist, or without wishlist reminders, then compare total purchases over 30 to 60 days. If total purchases are higher in the treatment group, the wishlist brings incremental value. If they're equal, it's just shifting timing. I'd also look at purchase timing and cart abandonment. The goal is to prove incrementality, not just attribution, since wishlist purchases would naturally look good even if they'd have happened anyway."}, {"id": 28, "category": "指标体系 Metrics", "question": "如何衡量 AI Agent 任务完成质量", "english": "Measure AI agent task success", "frameworkEN": "Value → North Star → Driver Tree → Guardrails → Segments", "frameworkZH": "定义用户获得的核心价值 → 北极星指标 → 拆分可行动的驱动指标 → 护栏指标 → 分群与埋点", "steps": ["1. 框定问题 / Frame: 针对「如何衡量 AI Agent 任务完成质量」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。"], "detail": "先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "metrics": "北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Value", "An AI agent creates value when it completes a real task correctly end to end with minimal human effort, for example updating 20 CRM records after a sales call, or booking a meeting with 4 people across time zones."], ["North Star", "'Weekly tasks completed successfully without human correction.' Success must be verified by an outcome check (the record really changed correctly) or user confirmation, not by the agent saying 'done'. This keeps the metric honest."], ["Driver Tree", "Successful tasks = tasks started × completion rate × correctness rate. Completion depends on planning quality, tool call success and error handling. Correctness depends on understanding intent, using the right data and following constraints. Also track repeat usage: users who trust the agent give it more tasks."], ["Guardrails", "Rate of harmful or irreversible errors (wrong email sent, wrong payment), human takeover rate, P95 latency per task, cost per task, and user-reported incidents. One serious error can erase a lot of trust, so these guardrails need tight thresholds."], ["Segments", "By task type (simple lookups versus multi-step workflows), by tool and integration, by customer, and by user experience level. A rise in success rate driven only by easy tasks would hide problems on the hard ones."]], "followup": "你怎么界定 Agent 任务是否“成功”？如果用户没有反馈怎么办？", "followupAnswer": "I'd use a combination of signals. First, outcome checks: did the calendar event get created, did the record update with correct values? Second, implicit behavior: the user didn't undo, retry or manually redo the task. Third, explicit feedback where it's natural, like a quick confirm. For tasks without feedback, I'd sample and have human reviewers grade them against a rubric. I'd also build an offline evaluation set with known correct outcomes. Combining these gives a reliable success rate even when most users stay silent."}, {"id": 29, "category": "指标体系 Metrics", "question": "如何为双边市场设计指标体系", "english": "Design marketplace metrics", "frameworkEN": "Value → North Star → Driver Tree → Guardrails → Segments", "frameworkZH": "定义用户获得的核心价值 → 北极星指标 → 拆分可行动的驱动指标 → 护栏指标 → 分群与埋点", "steps": ["1. 框定问题 / Frame: 针对「如何为双边市场设计指标体系」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。"], "detail": "先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "metrics": "北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Value", "A marketplace creates value by matching two sides efficiently. Take a home services marketplace: customers want a reliable plumber quickly, and plumbers want a steady flow of good jobs. Both must win or the marketplace shrinks."], ["North Star", "'Successful jobs completed per week': booked, completed and not disputed. It requires both sides to show up and succeed, so neither side can be optimized alone."], ["Driver Tree", "Completed jobs = active customers × requests per customer × match rate × completion rate. Supply side: active providers × available hours × acceptance rate. Liquidity is key: time to match, and the share of requests that get at least one qualified provider within an hour, measured per city and category."], ["Guardrails", "Cancellation and dispute rates, provider earnings and churn, customer satisfaction and repeat rate, fraud, and take rate. If take rate rises but provider churn rises too, we're borrowing from the future."], ["Segments", "By city (each city is its own market with different liquidity), category, and new versus returning users on both sides. A marketplace can look healthy overall while failing in new cities."]], "followup": "双边市场中买家和卖家的目标冲突时，比如价格，你如何设计指标平衡？", "followupAnswer": "I'd set the North Star at the transaction level, since it requires both sides to be satisfied enough to participate. Then I'd add side-specific health metrics: buyer conversion and satisfaction, seller earnings and retention. When an experiment helps one side at the cost of the other, the guardrails catch it. For pricing, I'd monitor price levels relative to competitors and seller margins. The principle: one shared top-level goal, with guardrails on both sides so no team can win by hurting the other."}, {"id": 30, "category": "指标体系 Metrics", "question": "如何衡量企业知识库 RAG 产品的成功", "english": "Measure enterprise RAG success", "frameworkEN": "Value → North Star → Driver Tree → Guardrails → Segments", "frameworkZH": "定义用户获得的核心价值 → 北极星指标 → 拆分可行动的驱动指标 → 护栏指标 → 分群与埋点", "steps": ["1. 框定问题 / Frame: 针对「如何衡量企业知识库 RAG 产品的成功」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。"], "detail": "先说明产品价值交付的“成功事件”，而不是把 DAU 当成万能北极星。将成功事件拆为活跃用户 × 人均任务次数 × 任务成功率，并按用户角色、生命周期和渠道分层。", "metrics": "北极星：每周成功价值事件数；驱动：激活率、任务频次、成功率；护栏：留存、投诉率、成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Value", "An enterprise RAG product helps employees get accurate answers from company knowledge, such as policies, product docs and past tickets, without searching across 5 tools or interrupting colleagues. Value is a correct answer, with a source the employee can trust."], ["North Star", "'Weekly questions answered correctly with valid citations.' Correctness comes from sampled reviews and user feedback; valid citation means the cited document actually supports the answer. This combines adoption with quality."], ["Driver Tree", "Correct answers = active users × questions per user × retrieval success (the right document is found) × answer accuracy (the model uses it correctly). Retrieval depends on content coverage, freshness and indexing quality; accuracy depends on the model, prompt and how chunks are presented. Adoption depends on where the tool lives, such as inside Slack or Teams."], ["Guardrails", "Permission leaks (showing a document the user can't access) with a target of zero, hallucination rate, P95 latency, cost per query, and share of answers citing outdated documents."], ["Segments", "By department and use case (HR policy, IT help, sales enablement, engineering docs), by content source, and by question type. A department with low accuracy often has a content gap, not a model problem."]], "followup": "如何证明这个产品为企业节省了时间？客户的采购方会问 ROI。", "followupAnswer": "I'd measure before and after with a few methods. First, a time study with a sample of users: how long it takes to find answers before versus with the tool. Second, proxy metrics in product, like questions answered times estimated minutes saved per answer, validated by surveys. Third, downstream metrics like fewer IT or HR tickets for repeated questions. Then I'd turn it into ROI: hours saved times average hourly cost, minus license cost. For buyers, I'd present a conservative estimate with clear assumptions, which is more believable than an inflated one."}, {"id": 31, "category": "指标诊断 Diagnosis", "question": "DAU 突然下降 30%，如何定位原因", "english": "Diagnose 30% DAU drop", "frameworkEN": "Validate → Segment → Funnel → Hypotheses → Verify → Act", "frameworkZH": "先排除口径和数据管道问题 → 按时间/平台/版本/人群切分 → 定位漏斗折损点 → 内外部假设 → 数据验证 → 修复与监控", "steps": ["1. 框定问题 / Frame: 针对「DAU 突然下降 30%，如何定位原因」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。"], "detail": "先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "metrics": "受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Validate", "First I'd check if the drop is real. Is it in all dashboards or one? Did the event definition, logging or data pipeline change? Is there a data delay? A sudden 30% drop overnight is often a tracking issue, so I'd confirm with a second source like server logs."], ["Segment", "If real, I'd cut by platform (iOS, Android, web), app version, country, new versus existing users, and acquisition channel. A sudden drop usually concentrates in one segment, for example only Android on the latest version."], ["Funnel", "For the affected segment, I'd check where users stop: app open, login, home feed load, or core action. If app opens are normal but logins dropped, it points to an authentication issue."], ["Hypotheses", "Internal: a release bug, a backend outage, a change to notifications, or a ranking change. External: a holiday, a competitor launch, an app store issue, or an OS update. Also, marketing campaigns ending can drop new user DAU."], ["Verify", "Match timing with release logs and incident reports; check crash rates and error logs; compare against previous years for seasonality; look at notification send volume."], ["Act", "If it's a bug, roll back or hotfix, then monitor recovery in the affected segment. Afterwards, add alerts for that metric by segment so we catch it faster next time, and write a short postmortem."]], "followup": "如果排查后发现各个分群都均匀下降了 30%，没有集中在某一部分，你会怎么想？", "followupAnswer": "A uniform drop across every segment points to something that affects everyone at once, so I'd focus on platform-wide causes. First, data again: a change in how DAU is calculated or a logging library update hits all segments equally. Second, shared infrastructure: an outage in login, notifications or the main API. Third, external events that affect all users, like a major holiday or a large news event. I'd check server request volumes, since if requests are normal but tracked DAU fell, it's a tracking problem. If requests also fell, I'd look at notification delivery and infrastructure incidents on that date."}, {"id": 32, "category": "指标诊断 Diagnosis", "question": "新用户注册转化率下降 20%，如何诊断", "english": "Diagnose 20% signup conversion drop", "frameworkEN": "Validate → Segment → Funnel → Hypotheses → Verify → Act", "frameworkZH": "先排除口径和数据管道问题 → 按时间/平台/版本/人群切分 → 定位漏斗折损点 → 内外部假设 → 数据验证 → 修复与监控", "steps": ["1. 框定问题 / Frame: 针对「新用户注册转化率下降 20%，如何诊断」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。"], "detail": "先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "metrics": "受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Validate", "Confirm the drop is real: check that the signup event still fires correctly, that the denominator (landing page visitors) didn't change definition, and that bot traffic filtering didn't change."], ["Segment", "Break down by traffic source, device, browser, country and signup method (email, Google, Apple). A drop in one channel, like paid ads, often means traffic quality changed, not the product."], ["Funnel", "Landing → start signup → enter info → verify email or phone → complete. Find which step dropped. A drop at verification points to email or SMS delivery problems."], ["Hypotheses", "Internal: new form fields, a bug in social login, slower page load, a design change. External: a campaign bringing lower intent traffic, a browser update breaking cookies, competitor offers."], ["Verify", "Check release and experiment logs for the date; test the signup flow manually across devices; look at error logs and verification delivery rates; compare traffic mix before and after."], ["Act", "Fix the root cause, for example revert the form change or fix the verification provider. If it's traffic quality, work with marketing to adjust targeting. Then add monitoring for each funnel step."]], "followup": "如果发现是市场部投放带来大量低质量流量导致转化率下降，但注册总量其实增加了，你怎么看？", "followupAnswer": "Then the conversion rate drop isn't a product problem; it's a mix shift. The key question is whether the extra signups are valuable. I'd look further down the funnel: do these new users activate and retain? What's the cost per activated user from this campaign versus other channels? If they activate at reasonable rates and the cost is acceptable, total growth is good and I'd update the dashboard to show conversion by channel so we don't panic. If they don't activate, I'd work with marketing to optimize for activated users, not just signups."}, {"id": 33, "category": "指标诊断 Diagnosis", "question": "电商支付转化率下降但流量上升，怎么办", "english": "Diagnose ecommerce checkout conversion decline", "frameworkEN": "Validate → Segment → Funnel → Hypotheses → Verify → Act", "frameworkZH": "先排除口径和数据管道问题 → 按时间/平台/版本/人群切分 → 定位漏斗折损点 → 内外部假设 → 数据验证 → 修复与监控", "steps": ["1. 框定问题 / Frame: 针对「电商支付转化率下降但流量上升，怎么办」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。"], "detail": "先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "metrics": "受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Validate", "Confirm tracking: check payment events, order counts in backend data, and whether traffic growth includes bots or a new source counted differently."], ["Segment", "Split by traffic source, device, new versus returning visitors, country and payment method. If traffic went up from a new channel, the conversion drop may simply be lower intent visitors."], ["Funnel", "Product page → add to cart → checkout start → shipping info → payment → confirmation. Look at absolute orders as well as rates. If orders are stable but traffic is up, it's mix. If orders dropped, something is broken."], ["Hypotheses", "Mix: new campaign or viral traffic with low intent. Product: payment provider errors, a new checkout field, higher shipping cost shown at checkout, a promo code issue. External: competitor sale, payment fraud rules blocking cards."], ["Verify", "Compare conversion for returning visitors, who are a stable group. If they're steady, it's traffic mix. Check payment decline rates by provider and card type, and recent price or shipping changes."], ["Act", "If mix, report conversion by channel and evaluate campaign value by revenue per visit. If broken, fix payment issues fast, since every hour costs revenue. Set up alerts on payment success rate."]], "followup": "如果发现支付失败率在某种银行卡上大幅上升，你会如何处理和沟通？", "followupAnswer": "This is urgent because it directly loses revenue. I'd work with engineering to check error codes from the payment provider, to see if it's fraud rules, a provider outage or a bank side issue. Short term, I'd offer alternatives: show other payment methods clearly when a payment fails, or route to a backup provider if available. I'd inform stakeholders, like customer support and finance, with an estimate of impact and expected fix time. After resolving, I'd add monitoring per card type and provider so we catch future issues quickly."}, {"id": 34, "category": "指标诊断 Diagnosis", "question": "AI 搜索点击率上涨但满意度下降，为什么", "english": "Explain higher AI search CTR but lower satisfaction", "frameworkEN": "Validate → Segment → Funnel → Hypotheses → Verify → Act", "frameworkZH": "先排除口径和数据管道问题 → 按时间/平台/版本/人群切分 → 定位漏斗折损点 → 内外部假设 → 数据验证 → 修复与监控", "steps": ["1. 框定问题 / Frame: 针对「AI 搜索点击率上涨但满意度下降，为什么」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。"], "detail": "先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "metrics": "受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Validate", "Check how CTR and satisfaction are measured. Did the satisfaction survey change, its timing or the sample? Is CTR counting new elements, like clicks on 'show more'?"], ["Segment", "Break down by query type, user group and the version of the AI answer. Maybe the change affects specific queries, like complex questions."], ["Funnel", "Search → AI answer → click on source or expand → result found or not → re-search. Higher CTR might mean users click more because the answer is incomplete or wrong."], ["Hypotheses", "Clicks rising because users don't trust or understand the answer and need to verify; a UI change made links more prominent; answer quality dropped, so users click sources looking for the right answer; or more clickbait style answers."], ["Verify", "Look at re-search rate and time to success: if both increased, users are struggling. Read samples of low satisfaction sessions. Compare answer quality scores before and after the change."], ["Act", "If answer quality fell, roll back and fix. Long term, stop using CTR as a success metric for AI search, and use task success, satisfaction and re-search rate instead."]], "followup": "你会怎么设计一个更好的 AI 搜索核心指标，避免这种矛盾再出现？", "followupAnswer": "I'd use a 'successful session' metric that combines signals: the user got an answer, didn't re-search within a short time, and either engaged positively (copy, follow-up question, positive rating) or clicked a source and stayed. I'd validate it with human ratings on a sample so we know it correlates with real satisfaction. CTR would become a diagnostic metric, not a target. I'd also track answer quality offline with a golden dataset. Combining online behavior and offline quality reduces the chance of optimizing the wrong thing."}, {"id": 35, "category": "指标诊断 Diagnosis", "question": "SaaS 客户流失率突然升高，如何排查", "english": "Diagnose SaaS churn spike", "frameworkEN": "Validate → Segment → Funnel → Hypotheses → Verify → Act", "frameworkZH": "先排除口径和数据管道问题 → 按时间/平台/版本/人群切分 → 定位漏斗折损点 → 内外部假设 → 数据验证 → 修复与监控", "steps": ["1. 框定问题 / Frame: 针对「SaaS 客户流失率突然升高，如何排查」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。"], "detail": "先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "metrics": "受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Validate", "Confirm churn definition: is it cancellations, non-renewals, or downgrades? Did billing changes, like moving to annual plans, shift the timing? Check that the spike isn't from one large account."], ["Segment", "Split by customer size, plan, industry, tenure, region and acquisition channel. Churn spikes often concentrate in one cohort, like customers acquired by a past discount campaign."], ["Funnel", "Look at the customer lifecycle: activation, usage depth, support interactions, renewal. Check if churned accounts had low usage before leaving or if they were active and left suddenly."], ["Hypotheses", "Price increase, product issues like outages or bugs, removal of features, competitor offers, customers' budget cuts, or poor onboarding of a specific cohort."], ["Verify", "Read cancellation reasons and support tickets; interview a few churned customers; compare usage trends 60 days before churn; check timing against price changes and releases."], ["Act", "Short term: reach out to at-risk accounts with low usage signals. Long term: fix the root cause and build a health score to flag churn risk early."]], "followup": "你会怎么搭建一个客户健康度评分，提前预警流失？", "followupAnswer": "I'd use historical data to find signals that predict churn, such as falling active users, fewer core actions, unresolved support tickets, missing integrations, or a champion leaving. I'd weight them into a simple score, validate that it separates churned and retained accounts in the past, and keep it explainable so customer success can act on it. Then I'd connect actions to each risk level, like automated tips for small accounts and a CSM call for large accounts. I'd measure whether intervention reduces churn compared to a holdout group."}, {"id": 36, "category": "指标诊断 Diagnosis", "question": "某次版本发布后留存率下降，怎么分析", "english": "Diagnose retention decline after release", "frameworkEN": "Validate → Segment → Funnel → Hypotheses → Verify → Act", "frameworkZH": "先排除口径和数据管道问题 → 按时间/平台/版本/人群切分 → 定位漏斗折损点 → 内外部假设 → 数据验证 → 修复与监控", "steps": ["1. 框定问题 / Frame: 针对「某次版本发布后留存率下降，怎么分析」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。"], "detail": "先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "metrics": "受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Validate", "Confirm the drop is tied to the release: compare users on the new version versus those still on the old version during the same time. Check that retention calculation and cohorts didn't change."], ["Segment", "Break down by platform, device, user type and features used. Look at whether new or existing users are affected."], ["Funnel", "Trace key actions in the first days: open, core action, return. Find which action decreased on the new version."], ["Hypotheses", "A bug or crash, slower performance, a UI change that confuses users, a removed feature, changed notifications, or a new onboarding flow."], ["Verify", "Check crash and performance data; compare feature usage between versions; read app store reviews and support tickets after the release; run usability tests."], ["Act", "If a bug, hotfix quickly. If a design change, consider reverting or A/B testing alternatives. In future, use staged rollouts with retention monitoring so issues are caught before full release."]], "followup": "如果这个版本是公司战略需要必须保留的改版，但留存下降，你会怎么办？", "followupAnswer": "I'd separate the strategic goal from the specific design. The strategy may be right, but the implementation can be improved. I'd find out which part of the change hurts retention, through data and user research, and fix that part while keeping the strategy. For example, keep the new navigation but add a guide or restore a shortcut. I'd share data with leadership, propose a plan with clear targets and a timeline for retention recovery, and set a threshold where we'd revisit the decision if the impact stays too high."}, {"id": 37, "category": "指标诊断 Diagnosis", "question": "推荐系统 CTR 上升但总时长下降，怎么办", "english": "Explain higher recommender CTR but lower watch time", "frameworkEN": "Validate → Segment → Funnel → Hypotheses → Verify → Act", "frameworkZH": "先排除口径和数据管道问题 → 按时间/平台/版本/人群切分 → 定位漏斗折损点 → 内外部假设 → 数据验证 → 修复与监控", "steps": ["1. 框定问题 / Frame: 针对「推荐系统 CTR 上升但总时长下降，怎么办」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。"], "detail": "先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "metrics": "受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Validate", "Confirm both metrics are defined the same way as before: CTR is clicks divided by impressions on the same surfaces, and watch time is still measured per user per day. Check for logging changes, such as autoplay previews being counted as clicks."], ["Segment", "Split by surface (home feed, up next, search), content type (short versus long), user tenure and device. Suppose the shift is concentrated in the home feed after a new ranking model launched 2 weeks ago."], ["Funnel", "Impression → click → watch start → watch duration → next action (another video or leave). If CTR rose 8% but average watch duration per click fell 15% and sessions end sooner, users are clicking more but are less satisfied with what they get."], ["Hypotheses", "1) The new model optimizes for predicted clicks, so it favors clickbait thumbnails and titles. 2) More short videos are recommended, which have high CTR but low total time. 3) Recommendations became more repetitive, so users get bored faster. 4) A UI change made thumbnails bigger."], ["Verify", "Compare content mix before and after; look at early exit rate (left within 30 seconds); check 'not interested' feedback and survey satisfaction; run the old model against the new in an A/B test to confirm causality."], ["Act", "Adjust the ranking objective to include watch time, satisfaction surveys and negative feedback, not clicks alone. Add total watch time and D7 retention as guardrails for every ranking experiment."]], "followup": "你会怎么设计推荐系统的目标函数来平衡点击、时长和长期满意度？", "followupAnswer": "I'd combine several signals with weights, rather than optimizing one. Short term: probability of click. Medium term: expected watch time or completion. Long term: signals that predict return visits, such as survey 'was this worth your time', likes, shares and subscribes. Negative signals reduce the score: quick exits, 'not interested', and dislikes. The weights should be tuned by experiments that look at long-term metrics like 30-day retention, using long-running holdouts, because short tests over-reward clicks. I'd also add diversity and creator fairness constraints so the system doesn't just recommend the same type of content. And I'd review the objective regularly, since user behavior changes."}, {"id": 38, "category": "指标诊断 Diagnosis", "question": "AI Agent 成功率下降且延迟增加，怎么诊断", "english": "Diagnose agent success decline and latency increase", "frameworkEN": "Validate → Segment → Funnel → Hypotheses → Verify → Act", "frameworkZH": "先排除口径和数据管道问题 → 按时间/平台/版本/人群切分 → 定位漏斗折损点 → 内外部假设 → 数据验证 → 修复与监控", "steps": ["1. 框定问题 / Frame: 针对「AI Agent 成功率下降且延迟增加，怎么诊断」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。"], "detail": "先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "metrics": "受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Validate", "Check whether success and latency are still measured the same way, for example did we change how 'success' is judged by the evaluator, or start measuring latency end to end instead of per step? Also check if task mix changed, since harder tasks are naturally slower and fail more."], ["Segment", "Break down by task type, model version, tool used, customer and time. Suppose failures and latency are concentrated in tasks that use the CRM lookup tool, starting 3 days ago."], ["Funnel", "Request → planning → tool call 1..n → result processing → final answer. Look at step-level data: is the agent taking more steps, are tool calls timing out, or is the final answer failing validation?"], ["Hypotheses", "1) The CRM API got slower or changed its response format, so the agent retries and fails. 2) A model or prompt update changed planning, causing more steps. 3) Traffic growth caused rate limits. 4) New customers have more complex data."], ["Verify", "Check tool error logs and latency per tool; compare traces of failed tasks before and after; run the offline eval suite on the current and previous prompt or model versions; check vendor status pages and API changelogs."], ["Act", "If the CRM API changed, update the integration and add schema validation. Add timeouts, retries with limits and a clear fallback message. Set alerts on per-tool error rate and P95 latency so the next incident is caught in hours, not days."]], "followup": "如果原因是第三方 API 变慢，而你无法控制它，你会怎么处理？", "followupAnswer": "I'd reduce how much the agent depends on it and limit damage when it's slow. Short term: set strict timeouts so the agent doesn't hang, retry once with backoff, and give users a clear partial answer, like 'I couldn't reach the CRM, here's what I found from other sources.' Cache data that doesn't change often, such as account details, so fewer calls are needed. Run independent calls in parallel. Medium term: raise the issue with the vendor using our latency data and check their SLA. Long term: if it stays unreliable, evaluate alternative providers or a local data sync. I'd track per-tool latency and success rate on the agent health dashboard so we see the impact clearly."}, {"id": 39, "category": "指标诊断 Diagnosis", "question": "某个地区 Uber 订单取消率上升，如何分析", "english": "Diagnose Uber cancellations spike in one region", "frameworkEN": "Validate → Segment → Funnel → Hypotheses → Verify → Act", "frameworkZH": "先排除口径和数据管道问题 → 按时间/平台/版本/人群切分 → 定位漏斗折损点 → 内外部假设 → 数据验证 → 修复与监控", "steps": ["1. 框定问题 / Frame: 针对「某个地区 Uber 订单取消率上升，如何分析」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。"], "detail": "先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "metrics": "受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Validate", "Confirm the spike is real: check whether cancellation logic or definitions changed, such as counting auto-cancellations after no driver match. Make sure it's not a data delay."], ["Segment", "Split by who cancels (rider or driver), time of day, neighborhood, trip type and app version. Suppose rider cancellations after matching rose from 8% to 14%, mostly during evening peak in downtown."], ["Funnel", "Request → match → driver en route → arrival → trip start. Rider cancellations after matching usually mean the ETA was longer than expected or the driver went the wrong way."], ["Hypotheses", "1) Driver supply dropped, perhaps because a competitor is offering driver bonuses, so ETAs got longer. 2) Road construction or a new event venue is causing traffic. 3) A pricing change made riders compare apps. 4) A map or routing bug sends drivers to the wrong pickup point."], ["Verify", "Compare driver online hours and ETAs before and after; check local events, weather and road closures; review recent product releases for the region; look at competitor promotions; read support tickets for 'driver went wrong way' complaints."], ["Act", "If supply is the issue: targeted driver incentives for evening downtown and better ETA accuracy shown before booking. If routing: fix pickup points. Monitor cancellation rate, ETA and driver supply daily until recovered."]], "followup": "如果发现是竞争对手在这个城市给司机大额补贴，你会怎么应对？", "followupAnswer": "I'd avoid a blanket subsidy war, since competitor promotions are usually temporary and matching them everywhere is expensive. First, quantify: how many driver hours we lost, in which times and areas, and the cost in cancellations and lost trips. Then respond precisely: targeted incentives only for the hours and zones where supply is short, and for high-quality drivers most likely to switch. Second, strengthen non-cash advantages: consistent earnings, faster payouts, better trip matching to reduce empty miles. Third, on the rider side, set accurate ETAs to reduce frustrated cancellations. I'd track driver supply, earnings per hour versus competitor, and cancellation rate, and plan to reduce incentives once the competitor's promotion ends."}, {"id": 40, "category": "指标诊断 Diagnosis", "question": "B2B 产品使用量增加但续费率下降，为什么", "english": "Explain higher SaaS usage but lower renewals", "frameworkEN": "Validate → Segment → Funnel → Hypotheses → Verify → Act", "frameworkZH": "先排除口径和数据管道问题 → 按时间/平台/版本/人群切分 → 定位漏斗折损点 → 内外部假设 → 数据验证 → 修复与监控", "steps": ["1. 框定问题 / Frame: 针对「B2B 产品使用量增加但续费率下降，为什么」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。"], "detail": "先检查事件埋点、分母和数据延迟；用版本×渠道×地区×新老用户切片，定位下降贡献最大的群组。然后沿关键漏斗比较前后转化率，结合发布记录、服务日志和外部变化做排除法。", "metrics": "受影响分群的核心指标恢复率；护栏：错误率、延迟和其他分群表现。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Validate", "Check how usage and renewal are measured. Is usage counted as logins, or meaningful actions? Is the renewal drop driven by a few large accounts, or broad?"], ["Segment", "Split by account size, industry, plan, contract length and who uses the product. Suppose usage growth comes from end users in mid-market accounts, while renewals fall in the same segment."], ["Funnel", "In B2B, the user and the buyer are different. Usage → perceived value by end users → value visible to the buyer → budget decision at renewal. A break between usage and buyer-visible value is common."], ["Hypotheses", "1) Usage is shallow: users log in because of notifications but don't get outcomes. 2) The buyer can't see ROI, so the product looks like a cost to cut. 3) Budget pressure in the industry. 4) A price increase at renewal. 5) A competitor bundles a similar feature for free, like Microsoft."], ["Verify", "Interview buyers of churned and renewed accounts, not only users; compare depth of usage (core outcomes per account) between churned and renewed accounts; check if price changes or bundling competitors appear in loss reasons."], ["Act", "Build buyer-facing value reporting, like an ROI dashboard and quarterly business reviews. Have customer success engage the buyer 90 days before renewal. If price is the issue, test packaging options. Track renewal rate and expansion by segment."]], "followup": "你会怎么设计一个给采购决策者看的价值报告？", "followupAnswer": "I'd design it around the buyer's goals, not our features. First, talk to a few buyers to find what they're measured on, such as cost savings, team productivity or compliance. Then turn product data into those outcomes: for example 'your team automated 1,200 tasks this quarter, about 300 hours saved, worth roughly $18K at your average labor cost.' Keep assumptions visible so the numbers are credible. The format is a simple one-page monthly or quarterly summary: 3 to 5 key metrics, trends, a highlight story from their team, and suggestions to get more value. I'd test it with a pilot group of accounts and measure whether renewal rates and expansion improve versus a similar group without the report."}, {"id": 41, "category": "实验与增长 Experimentation", "question": "如何设计新用户 onboarding 的 A/B test", "english": "Design onboarding A/B test", "frameworkEN": "Objective → Hypothesis → Experiment → Metrics → Decision", "frameworkZH": "明确目标与基线 → 提出可证伪假设 → 设计随机对照实验 → 主指标和护栏 → 显著性、效果量与上线决策", "steps": ["1. 框定问题 / Frame: 针对「如何设计新用户 onboarding 的 A/B test」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。"], "detail": "从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "metrics": "主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Objective", "Improve new user activation: the share of sign ups who complete the core action in their first week. Suppose the baseline is 35% and the onboarding funnel shows the biggest drop at the setup step, where 40% of users leave."], ["Hypothesis", "If we replace the 5-screen setup with a single screen plus a guided first task, more users will reach the core action, because they get value before being asked for effort. This is falsifiable: activation goes up or it doesn't."], ["Experiment", "Randomize by user at sign up, 50/50. Only new users, so existing users aren't affected. Calculate sample size from the baseline and the minimum effect we care about, say a 2 point lift; with 35% baseline that's roughly 9,000 users per group. Run at least 2 full weeks to cover weekday patterns. Check sample ratio mismatch on day 1."], ["Metrics", "Primary: 7-day activation rate. Secondary: time to first value, completion of each onboarding step. Guardrails: D30 retention (a faster but shallow onboarding could hurt later), support tickets, and profile completeness if other features depend on it."], ["Decision", "Ship if activation improves significantly and guardrails are neutral. If activation rises but D30 retention falls, investigate before shipping. If no change, use step-level data to learn which part failed and design the next test."]], "followup": "如果实验在第三天就显著了，你会提前结束实验吗？", "followupAnswer": "No. Stopping as soon as results look significant, known as peeking, inflates false positive rates. Early results are also biased by novelty and by day of week effects, since users who sign up on Monday may behave differently from weekend users. I'd stick to the planned duration and sample size. If the team needs faster decisions, we can plan for that upfront with sequential testing methods that allow valid early stopping. The exception is a clear harm: if a guardrail shows serious damage, like a broken flow, I'd stop to protect users."}, {"id": 42, "category": "实验与增长 Experimentation", "question": "如何判断实验显著但收益很小是否上线", "english": "Ship statistically significant but tiny experiment?", "frameworkEN": "Objective → Hypothesis → Experiment → Metrics → Decision", "frameworkZH": "明确目标与基线 → 提出可证伪假设 → 设计随机对照实验 → 主指标和护栏 → 显著性、效果量与上线决策", "steps": ["1. 框定问题 / Frame: 针对「如何判断实验显著但收益很小是否上线」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。"], "detail": "从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "metrics": "主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Objective", "Decide whether to ship a change that is statistically significant but has a very small effect, say a 0.3% lift in conversion."], ["Hypothesis", "Statistical significance tells us the effect is likely real, not that it's worth it. The question is whether the business value exceeds the costs."], ["Experiment", "Review the experiment quality first: was the sample large, was there SRM, novelty effects, or multiple metrics tested that raise false positives? Check confidence intervals, since the true effect could be near zero."], ["Metrics", "Estimate value: 0.3% lift times traffic times average order value. Compare with costs: maintenance, complexity, technical debt and opportunity cost. Check guardrails and segment effects for any harm."], ["Decision", "Ship if the change is low cost and the annualized value is meaningful, which at large scale it can be. Don't ship if it adds complexity, hurts UX, or has unclear long term effects. Small wins can add up, but each one should be worth its cost."]], "followup": "如果这个小改动会增加代码复杂度，但年化收益有 50 万美元，你会怎么权衡？", "followupAnswer": "I'd compare $500K with the full cost: engineering time to maintain, the risk of bugs, and slowing down future work. If maintenance is a few engineer weeks a year, $500K is clearly worth it. If it adds complexity to a core system and slows every future change, the hidden cost could be bigger. I'd ask engineering to estimate it, and look for a simpler implementation. I'd also validate the estimate with a longer holdout test, since small effects can fade over time."}, {"id": 43, "category": "实验与增长 Experimentation", "question": "如何提升 B2B SaaS 激活率", "english": "Improve B2B SaaS activation", "frameworkEN": "Objective → Hypothesis → Experiment → Metrics → Decision", "frameworkZH": "明确目标与基线 → 提出可证伪假设 → 设计随机对照实验 → 主指标和护栏 → 显著性、效果量与上线决策", "steps": ["1. 框定问题 / Frame: 针对「如何提升 B2B SaaS 激活率」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。"], "detail": "从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "metrics": "主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Objective", "Increase the share of new B2B trial accounts that reach activation, defined by actions that predict paying, such as inviting 3 teammates and running the core workflow."], ["Hypothesis", "Many trials fail because a single user signs up, explores alone, and never brings in the team or connects data. If we help them connect data and invite teammates in the first session, activation will go up."], ["Experiment", "Randomize at the account level, not the user level, since team members influence each other. Test a guided setup with a data connection step and a team invite prompt. B2B traffic is lower, so run longer, for example 4 to 6 weeks."], ["Metrics", "Primary: account activation within 14 days. Secondary: setup completion, invites sent and accepted, time to first workflow. Guardrails: trial to paid conversion, support load."], ["Decision", "Ship if activation improves without hurting conversion. If invites go up but activation doesn't, the invite step may bring people who don't use it, so look at engagement by invitees."]], "followup": "为什么 B2B 实验要按账户随机分组？会带来什么问题？", "followupAnswer": "Users in the same account work together, so if some see the new flow and others don't, they influence each other, which contaminates the result. Randomizing by account avoids that. The trade-off is fewer units, since there are fewer accounts than users, which reduces statistical power. To deal with it, I'd run longer, use metrics with less variance, apply techniques like CUPED using pre-experiment data, or combine with qualitative data from customer interviews."}, {"id": 44, "category": "实验与增长 Experimentation", "question": "如何提升 Duolingo 的 D7 留存", "english": "Improve Duolingo D7 retention", "frameworkEN": "Objective → Hypothesis → Experiment → Metrics → Decision", "frameworkZH": "明确目标与基线 → 提出可证伪假设 → 设计随机对照实验 → 主指标和护栏 → 显著性、效果量与上线决策", "steps": ["1. 框定问题 / Frame: 针对「如何提升 Duolingo 的 D7 留存」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。"], "detail": "从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "metrics": "主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Objective", "Increase D7 retention for new Duolingo users. Suppose baseline D7 is 55%, and data shows that users who complete a lesson on day 2 retain at more than twice the rate of those who don't. So day 2 return is the lever."], ["Hypothesis", "If we send the day 2 reminder at the same time of day the user first practiced, with a message about their specific progress ('2 more lessons to finish Unit 1'), more users will return on day 2, because the reminder fits their routine and makes progress concrete."], ["Experiment", "Randomize new users into 3 groups: control (current reminder), time-matched reminder, and time-matched plus progress message. This separates the effect of timing from the effect of content. At Duolingo's scale, detecting a 1 point lift in D7 takes about 1 to 2 weeks of new users. Check sample ratio and run full weeks."], ["Metrics", "Primary: D7 retention. Secondary: day 2 return rate, lessons completed in week 1. Guardrails: notification opt-out rate, uninstalls, and D30 retention to make sure the effect lasts."], ["Decision", "Ship the best variant if D7 improves and opt-outs don't rise. If D7 rises but D30 doesn't, the reminder is creating short-term pressure instead of a habit, so I'd iterate on habit-building features rather than more notifications."]], "followup": "如果实验同时测试多个版本，你怎么避免多重比较带来的误判？", "followupAnswer": "Each extra variant increases the chance of a false positive. I'd limit the number of variants to those with a clear hypothesis, define the primary metric and comparisons before the test, and adjust the significance level, for example with a Bonferroni correction or false discovery rate control. If a variant wins, I'd consider a follow-up test to confirm before full rollout, especially if the effect is small."}, {"id": 45, "category": "实验与增长 Experimentation", "question": "如何优化电商购物车放弃率", "english": "Reduce ecommerce cart abandonment", "frameworkEN": "Objective → Hypothesis → Experiment → Metrics → Decision", "frameworkZH": "明确目标与基线 → 提出可证伪假设 → 设计随机对照实验 → 主指标和护栏 → 显著性、效果量与上线决策", "steps": ["1. 框定问题 / Frame: 针对「如何优化电商购物车放弃率」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。"], "detail": "从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "metrics": "主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Objective", "Reduce cart abandonment for an online store. Suppose 70% of carts are abandoned, and funnel data shows the biggest drop at the step where shipping cost first appears."], ["Hypothesis", "Unexpected shipping costs at checkout make shoppers feel tricked and leave. If we show estimated shipping on the product page and in the cart, fewer people will abandon at checkout and overall purchases will rise."], ["Experiment", "Randomize by user (not session, so returning shoppers see a consistent experience). Variant: estimated shipping shown early, based on location. Control: current flow. Run 2 to 3 weeks to cover weekly patterns and paydays."], ["Metrics", "Primary: purchase conversion per visitor, not checkout completion, because showing shipping earlier could reduce add to cart and just move the drop. Secondary: cart abandonment, average order value, add to cart rate. Guardrails: revenue per visitor, customer complaints about price."], ["Decision", "Ship if purchases per visitor rise. If the drop simply moved earlier with no change in purchases, the real issue is the shipping price itself, so the next test is a free shipping threshold, like 'add $12 more for free shipping', which can raise both conversion and order size."]], "followup": "如果实验显示提前展示运费让加购率下降，但最终购买率不变，你会怎么做？", "followupAnswer": "It means we're filtering people earlier rather than losing more buyers. Total purchases are the same, so the business impact is neutral. However, it can still be valuable: shoppers have a more honest experience and fewer surprises, which builds trust and may reduce support complaints. I'd look at long term signals like repeat purchase rate. Then I'd test ways to reduce the shipping barrier itself, like a free shipping threshold or a clear 'add $10 for free shipping' message, which might increase both conversion and order size."}, {"id": 46, "category": "实验与增长 Experimentation", "question": "如何验证 AI 摘要是否提高用户效率", "english": "Test whether AI summaries save time", "frameworkEN": "Objective → Hypothesis → Experiment → Metrics → Decision", "frameworkZH": "明确目标与基线 → 提出可证伪假设 → 设计随机对照实验 → 主指标和护栏 → 显著性、效果量与上线决策", "steps": ["1. 框定问题 / Frame: 针对「如何验证 AI 摘要是否提高用户效率」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。"], "detail": "从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "metrics": "主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Objective", "Prove whether AI summaries in an email product actually save users time, rather than just being a feature people click on. The claim we want to support is 'users handle long email threads faster without making worse decisions.'"], ["Hypothesis", "Users with AI summaries reply to long threads (10 plus messages) faster, with equal or better reply quality, because they don't need to read every message."], ["Experiment", "Two layers. First, a controlled task study with 30 to 50 users: same threads, randomly with or without a summary, measuring completion time and the accuracy of their decisions. This gives clean causal evidence on time saved. Second, an online A/B test randomized by user, measuring time from opening a long thread to replying, archiving or forwarding."], ["Metrics", "Primary: time to action on long threads. Quality: share of replies needing a correction or follow-up like 'actually, I meant...', and accuracy in the task study. Usage: summary view rate and helpful ratings. Guardrails: errors caused by wrong summaries, opt-out rate."], ["Decision", "If time drops and quality holds, ship and use the time saved number in marketing and sales. If time drops but errors rise, the summary is missing key details, so improve accuracy and highlight decisions and deadlines before scaling."]], "followup": "线上数据很难测量“任务完成时间”，你会用什么替代指标？", "followupAnswer": "I'd use observable proxies: time from opening a document to the next meaningful action like replying, sharing or closing; whether the user scrolls through the full document; and how many documents they process per session. I'd complement these with periodic surveys asking how much time they saved, and small sample studies. Combining behavior and self-report gives a reasonable estimate without perfect measurement."}, {"id": 47, "category": "实验与增长 Experimentation", "question": "如何为低流量 B2B 功能设计实验", "english": "Experiment with low-traffic B2B features", "frameworkEN": "Objective → Hypothesis → Experiment → Metrics → Decision", "frameworkZH": "明确目标与基线 → 提出可证伪假设 → 设计随机对照实验 → 主指标和护栏 → 显著性、效果量与上线决策", "steps": ["1. 框定问题 / Frame: 针对「如何为低流量 B2B 功能设计实验」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。"], "detail": "从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "metrics": "主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Objective", "Evaluate a new bulk editing feature for a B2B admin tool used by about 400 accounts. Standard A/B testing with small effects would take months to reach significance."], ["Hypothesis", "Admins who get bulk editing complete their monthly user updates faster and file fewer support tickets."], ["Experiment", "Choose methods that work with small samples. 1) Use a metric close to the change and with low variance, like time to complete a user update task, instead of revenue or retention. 2) Randomize at the account level and use CUPED, adjusting with each account's pre-experiment behavior to reduce noise. 3) Run longer, 6 to 8 weeks. 4) If randomization isn't possible, roll out in stages and compare with a matched group of similar accounts."], ["Metrics", "Primary: median time per bulk update task. Secondary: feature adoption rate, number of support tickets about user management. Guardrails: error rate in edits, such as wrong permissions, and admin satisfaction."], ["Decision", "Combine quantitative results with qualitative evidence, like 8 to 10 admin interviews and session recordings. Use feature flags so we can turn it off quickly. Accept a lower certainty level for reversible decisions, and be stricter for risky ones."]], "followup": "如果没法做 A/B test，你会怎样说服团队某个功能是有效的？", "followupAnswer": "I'd build a case from several weaker sources that point in the same direction. First, a before and after comparison with a similar control group that didn't get the feature, which removes general trends. Second, look at leading behaviors that should change if the feature works, for example fewer manual edits or shorter task time. Third, qualitative evidence: user interviews and usability tests showing the problem is solved. Fourth, customer feedback from sales and support. I'd be honest about the limits and present a confidence level instead of claiming certainty. And I'd agree on metrics to track after launch, with a plan to change or remove the feature if they don't improve."}, {"id": 48, "category": "实验与增长 Experimentation", "question": "如何评估免费试用改为 14 天的影响", "english": "Evaluate 14-day free trial", "frameworkEN": "Objective → Hypothesis → Experiment → Metrics → Decision", "frameworkZH": "明确目标与基线 → 提出可证伪假设 → 设计随机对照实验 → 主指标和护栏 → 显著性、效果量与上线决策", "steps": ["1. 框定问题 / Frame: 针对「如何评估免费试用改为 14 天的影响」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。"], "detail": "从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "metrics": "主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Objective", "Evaluate shortening the free trial from 30 to 14 days for a SaaS product. The real goal is revenue per sign up over time, not just faster conversion."], ["Hypothesis", "A shorter trial creates urgency: users explore key features sooner and decide earlier, so more convert. The risk: users who need more time to see value, like teams that need to connect data, may leave before getting there."], ["Experiment", "Randomize new sign ups into 14 and 30 day trials. If trial length appears on the pricing page, show it consistently per user so marketing doesn't confuse results. Measure over at least 60 to 90 days, because the 30-day group needs time to finish and convert."], ["Metrics", "Primary: paid conversion within 60 days and revenue per sign up. Secondary: activation during the trial, time to convert. Guardrails: retention 3 months after first payment (are rushed buyers churning?), sign up rate, and support tickets about trial expiry."], ["Decision", "Pick the trial length with higher revenue per sign up and healthy post-payment retention. Check segments: small teams may do well with 14 days while larger accounts need 30, so a different trial per segment could be the best answer."]], "followup": "如果 14 天试用转化率更高，但付费后的留存率更低，你会怎么决策？", "followupAnswer": "I'd calculate lifetime value, not just conversion. Revenue per sign up over 6 to 12 months matters: if more users convert but leave quickly, LTV may be lower. I'd also check whether the shorter trial pushes users to buy before they've seen value. Options: keep 14 days with stronger onboarding so users activate faster, or offer extensions for users who are engaged but not ready. The decision should be based on long-term revenue and customer health."}, {"id": 49, "category": "实验与增长 Experimentation", "question": "如何提升协作产品的邀请转化率", "english": "Improve team invite conversion", "frameworkEN": "Objective → Hypothesis → Experiment → Metrics → Decision", "frameworkZH": "明确目标与基线 → 提出可证伪假设 → 设计随机对照实验 → 主指标和护栏 → 显著性、效果量与上线决策", "steps": ["1. 框定问题 / Frame: 针对「如何提升协作产品的邀请转化率」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。"], "detail": "从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "metrics": "主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Objective", "Increase invite conversion: the share of invites that turn into an active new teammate within 7 days. Suppose the baseline is 22%, with the biggest drop between email open and sign up."], ["Hypothesis", "Invitees don't join because the invite is generic: 'Alex invited you to join WorkTool.' If the invite shows exactly what they're invited to, such as the specific project, a preview of the content, and a personal note, they understand the value and conversion goes up."], ["Experiment", "Randomize by inviter, so everyone a given inviter invites sees the same version. Variant: invite email and landing page with project preview and an optional personal message prompt. Control: current invite. Run 3 to 4 weeks to collect enough inviters and give invitees time to join."], ["Metrics", "Primary: invitees who join and take a meaningful action, like commenting or editing, within 7 days. Secondary: open rate, click rate, sign up rate, time to join. Guardrails: spam complaints and unsubscribes, inviter drop-off if the personal message step adds friction."], ["Decision", "Ship if active invitee rate improves and guardrails are fine. Next tests: invite prompts at high-value moments, like when a user shares a doc, and a smoother sign up for invitees, such as one-click Google sign in."]], "followup": "为什么按邀请人分组而不是按被邀请人分组？", "followupAnswer": "Because the treatment starts with the inviter. The variant changes the inviter's flow, such as the personal message prompt, and the invite they send. If we randomized by invitee, one inviter could send different versions to different people, which mixes experiences and makes the inviter-side effect impossible to measure. Also, one invitee might get invites from several people, so invitee-level randomization creates contamination. Grouping by inviter keeps the experience consistent. The cost is fewer units and correlated results inside each inviter's group, so I'd account for that clustering in the analysis and make sure we have enough inviters for statistical power."}, {"id": 50, "category": "实验与增长 Experimentation", "question": "如何防止增长实验损害长期用户信任", "english": "Prevent growth experiments from harming trust", "frameworkEN": "Objective → Hypothesis → Experiment → Metrics → Decision", "frameworkZH": "明确目标与基线 → 提出可证伪假设 → 设计随机对照实验 → 主指标和护栏 → 显著性、效果量与上线决策", "steps": ["1. 框定问题 / Frame: 针对「如何防止增长实验损害长期用户信任」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。"], "detail": "从用户行为漏斗找到最大可控折损点，定义单一主假设；明确随机化单位、样本量/实验周期、SRM 检查、主指标和护栏，并区分统计显著与商业显著。", "metrics": "主指标：目标转化率或 D7 留存；护栏：投诉、取消、长期留存；ROI：增量收益减研发运营成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Objective", "Growth teams are rewarded for short-term metrics like sign ups or DAU. The goal is to keep those wins from damaging long-term trust, such as through dark patterns, spammy notifications or hard-to-cancel flows."], ["Hypothesis", "Some tactics raise short-term metrics while slowly hurting retention, brand and regulatory standing. Standard 2-week tests can't see this, so we need extra protection."], ["Experiment", "Three mechanisms. 1) Trust guardrails required in every growth test: notification opt-outs, unsubscribes, uninstalls, complaint rate, refunds and app store rating. 2) A long-term holdout, for example 5% of users who don't get any growth tactics for 6 months, to measure cumulative effects on retention and revenue. 3) A review checklist for sensitive changes: pricing, cancellation, notifications, privacy and children."], ["Metrics", "Short term: the test's primary metric. Long term: 90 and 180 day retention compared with the holdout, NPS, support ticket rate about billing or notifications."], ["Decision", "A test that wins on the primary metric but harms a trust guardrail beyond a set threshold is not shipped. Report holdout results to leadership quarterly, so the cost of aggressive tactics is visible."]], "followup": "举一个短期指标好看但长期有害的增长手段例子，你会怎么识别？", "followupAnswer": "A classic example is increasing push notifications. Sending twice as many pushes usually raises DAU for a few weeks, but users get annoyed, turn off notifications or uninstall, and then we lose the channel entirely. To identify it, I'd track notification opt-out and uninstall rates as guardrails in the test, and compare the long-term holdout group after 3 months, since that's when the harm shows up. Another example is a cancellation flow with many steps: churn drops short term, but complaints, chargebacks and negative reviews rise, and some regulators now penalize it. In both cases the signals are opt-outs, complaints, and long-term retention versus the holdout."}, {"id": 51, "category": "优先级与执行 Prioritization", "question": "工程资源只够做一个功能，如何排序", "english": "Prioritize with one engineer", "frameworkEN": "Outcome → Constraints → Options → RICE → Risks → Plan", "frameworkZH": "明确目标和资源约束 → 列出候选项 → 用 RICE/ROI 比较 → 考虑依赖与风险 → 沟通取舍并执行", "steps": ["1. 框定问题 / Frame: 针对「工程资源只够做一个功能，如何排序」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。"], "detail": "把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "metrics": "北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Outcome", "First I'd align on the single most important goal this quarter, for example improving activation for new customers, because the 'right' feature depends entirely on the goal."], ["Constraints", "One engineer for the quarter means about 10 to 12 weeks of work. Also check dependencies like design support, and any promises to customers or leadership."], ["Options", "Say we have three candidates: A, a simpler onboarding flow; B, an integration requested by sales; C, a reporting dashboard requested by current users."], ["RICE", "Score each. A: reach 100% of new users, impact high on activation, confidence medium from funnel data, effort 4 weeks. B: reach 15% of deals, impact high for those, confidence high from sales, effort 8 weeks. C: reach 30% of users, impact medium, confidence low, effort 6 weeks. A scores highest per unit of effort and directly ties to the goal."], ["Risks", "A may need design time; B may affect revenue in the short term if deals are lost. Check reversibility: A is easy to iterate on."], ["Plan", "Pick A, explain the reasoning to stakeholders with data, and propose a smaller step for B, like a workaround or partner tool. Revisit next quarter with new data."]], "followup": "如果销售 VP 坚持要先做集成功能，因为有一个大单在等，你会怎么办？", "followupAnswer": "I'd take it seriously and get the numbers: how big is the deal, how likely is it to close if we build it, and when do they need it? If the deal is large relative to the value of onboarding, B could be the right call; prioritization should follow value. I'd present both options to the VP and my manager with clear trade-offs: 'Building B delays onboarding by 8 weeks, which we estimate costs X in activation.' If we choose B, I'd confirm the customer commitment in writing. If not, I'd offer alternatives, like a partial integration or a timeline commitment."}, {"id": 52, "category": "优先级与执行 Prioritization", "question": "大客户要求定制功能，是否应该做", "english": "Handle enterprise custom feature request", "frameworkEN": "Outcome → Constraints → Options → RICE → Risks → Plan", "frameworkZH": "明确目标和资源约束 → 列出候选项 → 用 RICE/ROI 比较 → 考虑依赖与风险 → 沟通取舍并执行", "steps": ["1. 框定问题 / Frame: 针对「大客户要求定制功能，是否应该做」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。"], "detail": "把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "metrics": "北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Outcome", "The question is not 'can we build it' but 'does this move our strategy forward.' I'd assume we are a mid-stage B2B SaaS whose goal this year is growing net revenue retention in mid-market accounts, and a $400K ARR enterprise prospect asks for a custom approval workflow."], ["Constraints", "Our team ships about 8 engineer-weeks per month, the roadmap is committed for this quarter, and every custom branch adds permanent QA and support cost. I'd also check the contract: is the feature a condition of signing or a 'nice to have'?"], ["Options", "A: build exactly what they ask, just for them. B: build a configurable approval workflow that this customer and others can use. C: offer an API and webhooks so their IT team or a partner builds it. D: decline politely and keep the relationship."], ["RICE", "I'd search sales notes and support tickets: if 12 other accounts asked for approvals in different words, B has broad reach and high confidence. Impact: this deal alone is 8% of new ARR target. Effort: A is 6 weeks plus ongoing maintenance; B is 9 weeks but reusable; C is 2 weeks. B usually wins when the need is shared, C wins when it is truly unique."], ["Risks", "A creates a fork in the product and sets a precedent that big customers can buy roadmap. B risks delaying the committed roadmap by one sprint. D risks losing the logo and the reference value. Reversibility: B and C are safe to iterate on, A is hard to remove later."], ["Plan", "I'd meet the customer to understand the underlying job, not the requested solution, then propose B with a timeline, and C as a bridge if they need something sooner. I'd tell sales and leadership what B pushes out, and get the customer to join as a design partner so we validate it with real use."]], "followup": "如何判断一个大客户的需求是“共性需求”还是“个性化需求”？", "followupAnswer": "I'd look for the same underlying problem across customers, even when they describe it differently. Concretely: search support tickets, sales call notes and feature request boards for related keywords; ask customer success which accounts use workarounds like spreadsheets or manual emails for the same job; and check product data for signs of that workaround. Then I'd interview 4 to 5 similar accounts and ask about their process, not about the feature. If several of them share the job and would use a configurable version, it's a common need worth productizing. If the request depends on one customer's unique internal system or policy, it's custom, and I'd handle it with an API, professional services or a partner instead of the core product."}, {"id": 53, "category": "优先级与执行 Prioritization", "question"
