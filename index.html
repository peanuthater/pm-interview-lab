    "followup": "如果你的首选方案无法提升核心指标，你如何区分是用户需求判断错误、方案执行问题，还是实验设计问题？"
  }
];const CATS=[...new Set(DATA.map(x=>x.category))];const KEY='pm_lab_v1';let db={favorites:{},notes:{},drafts:{},done:{},mastered:{},stories:[]};try{db={...db,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}let tab='learn',filter='',category='all',current=null,revealed=false;const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),btn=(name,fn,cl='')=>`<button class="${cl}" onclick="${fn}">${name}</button>`;function nav(){ $('nav').innerHTML=[['learn','📖 学习'],['practice','✍️ 刷题'],['favorites','⭐ 星标'],['progress','📊 进度'],['stories','💼 经历库']].map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="switchTab('${id}')">${t}</button>`).join('')}function switchTab(t){tab=t;current=null;revealed=false;render()}function picker(){return `<div class="toolbar"><input id="search" placeholder="搜索题目 / Search" value="${esc(filter)}" oninput="filter=this.value;renderList()"><select id="cat" onchange="category=this.value;renderList()"><option value="all">全部题型</option>${CATS.map(c=>`<option value="${esc(c)}" ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button onclick="randomQ()">🎲 随机一题</button></div><div id="list"></div>`}function filtered(){return DATA.filter(q=>(category==='all'||q.category===category)&&(q.question.toLowerCase().includes(filter.toLowerCase())||q.english.toLowerCase().includes(filter.toLowerCase()))&&(tab!=='favorites'||db.favorites[q.id]))}function renderList(){let a=filtered();$('list').innerHTML=`<p class="muted">${a.length} 道题目</p><div class="question-list">${a.map(q=>`<button class="qrow" onclick="openQ(${q.id})"><b>${db.favorites[q.id]?'⭐ ':''}${q.id}. ${esc(q.question)}</b><span>${esc(q.english)} · ${esc(q.category)} ${db.mastered[q.id]?'· ✅ 已掌握':db.done[q.id]?'· ☑ 已学习':''}</span></button>`).join('')}</div>${a.length?'':'<div class="empty">没有匹配的题目</div>'}`};function randomQ(){let a=filtered();if(a.length)openQ(a[Math.floor(Math.random()*a.length)].id)}function openQ(id){current=id;revealed=tab!=='practice';render();window.scrollTo(0,0)}function updateNote(id,v){db.notes[id]=v;save()}function updateDraft(id,v){db.drafts[id]=v;save()}function star(id){db.favorites[id]=!db.favorites[id];save();render()}function mark(id,k){db[k][id]=!db[k][id];save();render()}function reveal(){let v=$('draft').value;if(!v.trim()){alert('请先输入你的回答，再解锁题解。');return}db.drafts[current]=v;db.done[current]=true;save();revealed=true;render()}function questionView(){let q=DATA.find(x=>x.id===current);let content=`<button onclick="current=null;render()">← 返回题库</button><section class="card"><span class="pill">${esc(q.category)}</span><h2>${q.id}. ${esc(q.question)}</h2><p class="muted">${esc(q.english)}</p><div class="actions">${btn(db.favorites[q.id]?'★ 已星标':'☆ 星标',`star(${q.id})`)}${btn(db.done[q.id]?'☑ 已学习':'标记已学习',`mark(${q.id},'done')`)}${btn(db.mastered[q.id]?'✅ 已掌握':'标记已掌握',`mark(${q.id},'mastered')`)}</div><h3>我的笔记 / 星标原因</h3><textarea placeholder="为什么收藏？哪些点容易漏？" oninput="updateNote(${q.id},this.value)">${esc(db.notes[q.id]||'')}</textarea></section>`;if(tab==='practice')content+=`<section class="card"><h3>先回答，再看题解</h3><p class="muted">建议按目标→分析→取舍→指标的结构作答；没有 AI 评分。</p><textarea id="draft" placeholder="Type your answer here / 输入自己的答案" oninput="updateDraft(${q.id},this.value)">${esc(db.drafts[q.id]||'')}</textarea><div class="actions">${btn(revealed?'✓ 已解锁':'提交回答并解锁', 'reveal()','primary')}</div></section>`;if(revealed)content+=`<section class="card"><h2>完整题解 / Answer Guide</h2><h3>结构化框架 · Framework</h3><div class="hint"><b>中文：</b>${esc(q.frameworkZH)}<br><b>English:</b> ${esc(q.frameworkEN)}</div><h3>详细解题思路 / Reasoning</h3><ol class="steps">${q.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h3>具体分析 / Deep Dive</h3><p>${esc(q.detail)}</p><h3>北极星、折损点、ROI / Metrics</h3><p>${esc(q.metrics)}</p><p class="muted">ROI 估算公式： (增量收益 − 开发、推理及运营成本) ÷ 总成本。需要基线、时间窗口和假设，不要编造事实。</p><h3>容易遗漏 / Common Pitfalls</h3><ul class="steps">${q.pitfalls.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>英文参考答案 / Sample Answer</h3><p>${esc(q.answer)}</p><h3>面试官追问 / Follow-up</h3><p>${esc(q.followup)}</p><div class="actions">${btn('复制英文答案',`copyAnswer(${q.id})`)}${btn('下一题',`nextQ(${q.id})`,'primary')}</div></section>`;return content}function copyAnswer(id){let q=DATA.find(x=>x.id===id);navigator.clipboard?.writeText(q.answer).then(()=>alert('已复制')).catch(()=>alert('浏览器不支持复制'))}function nextQ(id){let i=DATA.findIndex(q=>q.id===id);openQ(DATA[(i+1)%DATA.length].id)}function progress(){let n=DATA.length,d=Object.values(db.done).filter(Boolean).length,m=Object.values(db.mastered).filter(Boolean).length,f=Object.values(db.favorites).filter(Boolean).length;return `<div class="stats"><div class="stat"><b>${d}/${n}</b><small>已学习</small></div><div class="stat"><b>${m}</b><small>已掌握</small></div><div class="stat"><b>${f}</b><small>星标题目</small></div></div><section class="card"><h2>题型掌握度</h2>${CATS.map(c=>{let a=DATA.filter(q=>q.category===c),done=a.filter(q=>db.mastered[q.id]).length;return `<p>${esc(c)} · ${done}/${a.length}</p><div class="progress"><div style="width:${done/a.length*100}%"></div></div>`}).join('')}</section><section class="card"><h3>备份与迁移</h3><p>下载进度、笔记和星标 JSON，换设备时可导入。题库内置在网页中。</p><div class="actions">${btn('导出数据','exportData()','primary')}<label class="chip">导入备份<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>${btn('重置筛选','resetFilters()')}</div></section>`}function resetFilters(){filter='';category='all';render()}function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pm-interview-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(el){let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v||typeof v!=='object')throw Error();db={...db,...v};save();render();alert('导入成功')}catch(e){alert('无效的备份文件')}};r.readAsText(el.files[0])}function addStory(){let title=$('storytitle').value.trim(),desc=$('storydesc').value.trim();if(!title)return alert('请输入项目名称');db.stories.push({title,desc});save();render()}function stories(){let examples=['基金 / ETF AI Search（InvestPal）','企业数据分析 Agent / ChatBI','多模态作品集评审','汽车语音助手 Demo','PRD Writing Skill / DeepSeek Harness','Watchlist 产品体验优化','个人 AI 产品项目'];return `<section class="card"><h2>个人经历库 · 待完善</h2><p>这里已预留你的项目方向，但<strong>不会编造实际经历和数据</strong>。后续可以将完整项目复盘导入并扩展为 STAR、技术深挖、指标追问和英文口述题。</p>${examples.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}<h3>新增项目占位</h3><input id="storytitle" placeholder="项目名称"><textarea id="storydesc" placeholder="背景、个人职责、方案、指标、结果、真实数据与待确认事项"></textarea>${btn('保存项目','addStory()','primary')}</section>${db.stories.map((s,i)=>`<section class="card"><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p>${btn('删除',`deleteStory(${i})`)}</section>`).join('')}`}function deleteStory(i){if(confirm('删除此项目？')){db.stories.splice(i,1);save();render()}}function render(){nav();$('app').innerHTML=current!==null?questionView():tab==='progress'?progress():tab==='stories'?stories():`<section class="card"><h2>${tab==='learn'?'学习模式':tab==='practice'?'刷题模式':'星标题库'}</h2><p class="muted">${tab==='practice'?'必须填写回答后才会显示答案。':tab==='favorites'?'只显示你收藏的题目与笔记。':'直接阅读中英文结构化思路与参考答案。'}</p></section>${picker()}`;if(current===null&&['learn','practice','favorites'].includes(tab))renderList()}render();</script></body></html>
