: "销售承诺功能但工程排期不足怎么办", "english": "Sales promised feature beyond capacity", "frameworkEN": "Outcome → Constraints → Options → RICE → Risks → Plan", "frameworkZH": "明确目标和资源约束 → 列出候选项 → 用 RICE/ROI 比较 → 考虑依赖与风险 → 沟通取舍并执行", "steps": ["1. 框定问题 / Frame: 针对「销售承诺功能但工程排期不足怎么办」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。"], "detail": "把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "metrics": "北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Outcome", "Two outcomes matter at once: keep the customer's trust, since a broken promise hurts renewal and references, and protect the team's plan and quality. Suppose sales promised a bulk export feature to a key account in 4 weeks, but engineering estimates 8."], ["Constraints", "The committed roadmap is full, the date came from sales without product input, and the customer may have already planned around it internally."], ["Options", "A: deliver a smaller version on time, for example CSV export of the 2 data types they use most. B: negotiate a later date for the full version. C: move another roadmap item to make room. D: offer a temporary workaround, like a one-time export run by our support team."], ["RICE", "First I'd learn what the customer really needs by the date. Often the full scope isn't required on day one. Comparing options: A keeps most of the value at half the effort; C costs whatever item we push, which I'd quantify; D is cheap but doesn't scale."], ["Risks", "Missing the date damages trust and can put the deal at risk. Forcing 8 weeks into 4 leads to bugs, overtime and a worse product for everyone. Quietly absorbing it without fixing the process means it will happen again."], ["Plan", "I'd join sales on a call with the customer, confirm the must-have scope, and commit to A on the original date plus a clear date for the rest. I'd tell leadership what moved, if anything. Then I'd fix the root cause with a rule that customer-facing dates need product sign-off."]], "followup": "你会如何和销售团队建立机制，避免以后再出现类似承诺？", "followupAnswer": "I'd make it easy for sales to do the right thing rather than just adding a rule. First, a shared roadmap view with three labels: committed, planned, and exploring, so reps know what they can safely promise. Second, a quick path for deal-related requests: a form that reaches product within 48 hours with deal size and deadline, so sales doesn't feel blocked. Third, a simple rule that any date promised to a customer needs product approval, backed by sales leadership so it's enforced. Fourth, a monthly sync with sales leads to review the pipeline and upcoming asks. I'd measure success by fewer surprise commitments and faster response time to deal requests."}, {"id": 54, "category": "优先级与执行 Prioritization", "question": "线上严重 Bug 与新功能冲突如何决策", "english": "Choose between production bug and feature", "frameworkEN": "Outcome → Constraints → Options → RICE → Risks → Plan", "frameworkZH": "明确目标和资源约束 → 列出候选项 → 用 RICE/ROI 比较 → 考虑依赖与风险 → 沟通取舍并执行", "steps": ["1. 框定问题 / Frame: 针对「线上严重 Bug 与新功能冲突如何决策」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。"], "detail": "把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "metrics": "北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Outcome", "Keep customers' trust and the core business working, while still moving strategic work forward. Imagine a bug where 5% of invoices show the wrong tax amount, and a planned feature launch next week that marketing has announced."], ["Constraints", "The same 3 engineers own both. The launch date has external visibility; the bug is affecting customers now."], ["Options", "A: pause the feature and fix the bug first. B: ship the feature and fix the bug after. C: split the team, with one person on the bug and two on the feature, accepting a short delay."], ["RICE", "I'd assess the bug on four factors: scope (5% of invoices across how many customers), severity (wrong tax is a financial and legal issue), workaround (none for customers), and trend (is it growing). The feature's cost of delay: a one-week slip in a launch that marketing announced, with no revenue at risk this week."], ["Risks", "Billing errors can cause refunds, compliance issues and churn, and the cost grows with every invoice sent. A launch delay mainly costs some internal embarrassment and a reset of marketing messages."], ["Plan", "In this case I'd choose A or C: fix the bug first, since it's a P0. I'd notify affected customers with support, give marketing a new date, and explain the trade-off to leadership in one message. If the bug were cosmetic with a workaround, I'd make the opposite call and ship the feature."]], "followup": "你如何定义 Bug 的严重程度？", "followupAnswer": "I'd use a shared, simple scale so decisions don't depend on who shouts loudest. I look at four factors: how many users are affected, whether it blocks a core task, whether it involves data loss, money or security, and whether there is a workaround. P0: data loss, security, money errors, or a core flow down for many users. Fix immediately, even if it pauses other work. P1: an important feature broken for a segment, or a workaround that's painful. Fix within days. P2: minor issue with an easy workaround. Schedule into normal sprints. P3: cosmetic. Backlog. I'd agree on this scale with engineering and support in advance, and review it after incidents."}, {"id": 55, "category": "优先级与执行 Prioritization", "question": "如何制定一个季度产品路线图", "english": "Build quarterly roadmap", "frameworkEN": "Outcome → Constraints → Options → RICE → Risks → Plan", "frameworkZH": "明确目标和资源约束 → 列出候选项 → 用 RICE/ROI 比较 → 考虑依赖与风险 → 沟通取舍并执行", "steps": ["1. 框定问题 / Frame: 针对「如何制定一个季度产品路线图」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。"], "detail": "把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "metrics": "北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Outcome", "A roadmap should start from outcomes, not features. Say company goals this year are reducing churn and entering mid-market. For my product area, I'd translate that into 2 quarterly outcomes, for example 'raise 60-day activation from 40% to 50%' and 'launch the two features mid-market deals most often lose on.'"], ["Constraints", "Team capacity, say 6 engineers for 12 weeks, about 70 engineer-weeks, minus vacation and on-call. Known commitments to customers, platform dependencies, and required compliance or tech debt work."], ["Options", "I'd collect inputs from four sources: user research and support themes, product data such as funnel drop-offs, stakeholder asks from sales and leadership, and engineering's list of tech debt that slows us down. Then cluster them into themes like onboarding, admin controls, reliability."], ["RICE", "Score each candidate against the outcomes with RICE, then adjust for dependencies and strategic bets. Fill about 70% of capacity with outcome work, 10 to 15% with tech debt, and keep 15 to 20% as buffer for urgent issues."], ["Risks", "Overcommitting; listing features without clear success metrics; and stakeholders feeling surprised. I'd label items as committed versus stretch so everyone knows what's firm."], ["Plan", "Draft the roadmap, review it 1:1 with key stakeholders before the group meeting so there are no surprises, then publish it with outcomes and metrics. Check progress every 2 weeks and do a formal re-plan at mid-quarter."]], "followup": "路线图做好后，季度中途老板突然提出一个新的高优先级需求，你会怎么处理？", "followupAnswer": "I'd treat it as a trade-off, not an add-on. First, understand the 'why': what outcome does it serve, what triggered it, and what's the deadline. Then size it with engineering and compare it to the current roadmap using the same criteria. If it's more valuable than something in the plan, I'd show my manager exactly what has to move out, say 'this delays the admin controls by 4 weeks, which affects 2 mid-market deals', and get an explicit decision. If it's not more valuable, I'd explain why and offer a smaller first step or a date next quarter. I'd use the buffer capacity first if it fits. Either way, I'd update the roadmap and tell affected stakeholders the same day."}, {"id": 56, "category": "优先级与执行 Prioritization", "question": "如何定义 MVP 并决定哪些功能不做", "english": "Scope an MVP", "frameworkEN": "Outcome → Constraints → Options → RICE → Risks → Plan", "frameworkZH": "明确目标和资源约束 → 列出候选项 → 用 RICE/ROI 比较 → 考虑依赖与风险 → 沟通取舍并执行", "steps": ["1. 框定问题 / Frame: 针对「如何定义 MVP 并决定哪些功能不做」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。"], "detail": "把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "metrics": "北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Outcome", "An MVP exists to test the riskiest assumption with the least effort. Say we're building an automated weekly report for small sales teams. The riskiest assumption is that managers will actually read and act on an automated summary, not that we can generate charts."], ["Constraints", "We want learning within 6 weeks with 2 engineers and a designer."], ["Options", "Brainstorm the full list: data connectors for 5 CRMs, customizable charts, email and Slack delivery, team comparison, AI commentary, export to PDF, admin settings. Then sort each into must-have for the core loop, nice-to-have, and later."], ["RICE", "For each, ask: if we remove it, can a manager still get a useful report and act on it? Must-have: 1 CRM connector (the one 60% of target users use), a fixed report with 4 key metrics, and email delivery. Later: other CRMs, custom charts, PDF. AI commentary is tempting but can be faked manually at first by the team writing notes for 10 pilot customers."], ["Risks", "Too thin and users won't see value, so we'd get a false negative. Too broad and we learn slowly. I'd guard against the first by testing the prototype with 5 managers before building."], ["Plan", "Ship to 20 design-partner teams. Success metric: 50% of managers open the report 3 weeks in a row and at least 30% take an action, like messaging a rep. Write down the 'not doing' list and why, so the team and stakeholders agree."]], "followup": "如果团队成员坚持某个功能必须放进 MVP，你怎么说服他们？", "followupAnswer": "I'd start by understanding their reasoning, since they might know something I don't. I'd ask: what risk does this feature reduce, and would we learn something different without it? If it's essential for testing the core hypothesis, I'd add it. If not, I'd make the cost concrete: 'This adds 2 weeks, which delays our first real user data by 30%.' Then I'd look for a cheaper way to get the same learning, like a manual version, a fake door test, or including it for a few pilot users only. Finally, I'd agree on a clear trigger to add it later, for example 'if 3 or more pilot customers ask for it.' That makes it a shared decision instead of a debate of opinions."}, {"id": 57, "category": "优先级与执行 Prioritization", "question": "AI 功能准确率与响应速度如何权衡", "english": "Trade off AI accuracy vs latency", "frameworkEN": "Outcome → Constraints → Options → RICE → Risks → Plan", "frameworkZH": "明确目标和资源约束 → 列出候选项 → 用 RICE/ROI 比较 → 考虑依赖与风险 → 沟通取舍并执行", "steps": ["1. 框定问题 / Frame: 针对「AI 功能准确率与响应速度如何权衡」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。"], "detail": "把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "metrics": "北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Outcome", "The right balance depends on the use case. Suppose we run an AI customer support assistant: customers expect quick replies, but a wrong answer about refunds creates real cost."], ["Constraints", "Model options: a large model with about 92% accuracy on our eval set and 6 seconds P95 latency, and a small model with 84% accuracy and 1.5 seconds. Budget per conversation is limited."], ["Options", "A: use the large model everywhere. B: use the small model everywhere. C: route by complexity: the small model for simple FAQs, the large model for policy and account questions. D: stream the response so users see the first words fast while the rest generates."], ["RICE", "Look at the query mix: if 65% are simple FAQs where the small model is already 95% accurate, routing captures most of the speed benefit with little quality loss. For high-risk topics like refunds, accuracy matters more than speed. Streaming improves perceived latency at almost no cost."], ["Risks", "Routing errors, where a complex question is sent to the small model. Mitigate with a confidence threshold and escalation to the large model or a human. Also cost growth if routing sends too many queries to the large model."], ["Plan", "Implement C plus D, test with users to find the latency threshold where satisfaction drops, and track accuracy by topic, P95 latency, cost per conversation and escalation rate."]], "followup": "你会如何设定可接受的延迟和准确率标准？", "followupAnswer": "I'd set both from user behavior and business risk, not from intuition. For latency, I'd look at data: at what response time do users start retrying, abandoning or rating lower? Then confirm with a small experiment that adds artificial delay to a test group. For many chat products, time to first token under 1 to 2 seconds is important. For accuracy, I'd base the bar on the cost of a mistake: for low-risk FAQs maybe 90%, for billing or medical topics much higher, plus a human fallback. I'd measure accuracy with a labeled eval set that matches real query mix, and review the thresholds every quarter as models improve and costs change."}, {"id": 58, "category": "优先级与执行 Prioritization", "question": "如何判断应该自研还是采购 AI 能力", "english": "Build vs buy AI", "frameworkEN": "Outcome → Constraints → Options → RICE → Risks → Plan", "frameworkZH": "明确目标和资源约束 → 列出候选项 → 用 RICE/ROI 比较 → 考虑依赖与风险 → 沟通取舍并执行", "steps": ["1. 框定问题 / Frame: 针对「如何判断应该自研还是采购 AI 能力」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。"], "detail": "把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "metrics": "北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Outcome", "Pick the approach that gets users value fastest while building a durable advantage. Suppose we're a mid-size HR software company adding an AI assistant that answers policy questions and drafts job descriptions."], ["Constraints", "Our ML team has 3 people, no GPU infrastructure, and we need something in customers' hands within a quarter. Customer data is sensitive."], ["Options", "Buy: use a foundation model API from a major provider. Build: fine-tune or train our own model. Hybrid: buy the base model, and build what differentiates us, such as retrieval over customer policies, HR-specific prompts, evaluation and workflow integration."], ["RICE", "Ask where our advantage lies. The base model is a commodity improving every few months; our advantage is HR data, workflows and customer trust. Speed: buying ships in weeks, building takes quarters. Cost: at our scale, API costs are lower than hiring and running training infrastructure. Control: build only matters if we need offline deployment or unique behavior we can't get otherwise."], ["Risks", "Buy: vendor lock-in, data privacy, price changes and model behavior shifts. Build: high cost, slow, and we may still be worse than leading models."], ["Plan", "Go hybrid: buy the model, build retrieval, evals and the HR workflow layer. Use enterprise agreements with no training on our data, keep an abstraction layer to switch providers, and revisit 'build' when volume or a specific need justifies it."]], "followup": "如果使用第三方模型，如何降低供应商锁定的风险？", "followupAnswer": "I'd design for switching from day one. First, an internal abstraction layer so the app calls our own interface, not a vendor's API directly, which makes switching a configuration change instead of a rewrite. Second, our own evaluation set built from real tasks, so we can compare providers on quality, latency and cost in a day. Third, keep prompts and retrieval logic in our codebase and avoid vendor-only features unless they bring clear value. Fourth, test a second provider every quarter so the backup path stays real. Finally, negotiate contract terms on data usage, price protection and notice before model changes. These steps keep our leverage without slowing the team down."}, {"id": 59, "category": "优先级与执行 Prioritization", "question": "如何决定关闭一个低使用率功能", "english": "Sunset low usage feature", "frameworkEN": "Outcome → Constraints → Options → RICE → Risks → Plan", "frameworkZH": "明确目标和资源约束 → 列出候选项 → 用 RICE/ROI 比较 → 考虑依赖与风险 → 沟通取舍并执行", "steps": ["1. 框定问题 / Frame: 针对「如何决定关闭一个低使用率功能」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。"], "detail": "把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "metrics": "北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Outcome", "The goal is to simplify the product and free engineering time, without losing customers who rely on the feature. Suppose a legacy 'custom dashboard builder' is used by 3% of accounts but costs about 15% of the team's maintenance time."], ["Constraints", "Some of those 3% may be large accounts. Other features may depend on its code. Contracts may mention it."], ["Options", "A: remove it fully with notice. B: freeze it, no new investment but keep it running. C: replace it by merging the most used parts into the standard dashboard. D: move it to a paid add-on for those who need it."], ["RICE", "Analyze who uses it and how: are they large accounts, and which 2 or 3 functions do they use most? If most usage is a few saved views, C covers 90% of value at low cost. Quantify the gain: 15% of maintenance time is roughly 1 engineer, which could go to higher impact work."], ["Risks", "Churn of affected accounts, angry feedback, and broken integrations. Mitigate with direct outreach to top accounts, a migration tool and a long enough notice period."], ["Plan", "Choose C plus A: build the replacement for the top use cases, contact high-value users first, give 90 days' notice, offer migration help, then remove it. Track churn and support tickets in the affected group, and report the freed capacity."]], "followup": "如果少数重度用户强烈反对下线这个功能，你会怎么办？", "followupAnswer": "I'd treat their pushback as information, not just resistance. First, talk to them directly to understand which job the feature does for them and why the alternative doesn't work. Often it's one specific capability that I can add to the replacement. Second, check their business value: if they're large or strategic accounts, I'd consider a longer transition, a paid legacy plan, or a custom export. Third, if the decision stands, I'd explain the reasons honestly, give a clear timeline and offer hands-on migration help. I'd track whether these accounts stay and how satisfied they are, because handling a sunset well builds trust for future changes."}, {"id": 60, "category": "优先级与执行 Prioritization", "question": "产品发布延期两周，你如何处理", "english": "Handle two-week launch delay", "frameworkEN": "Outcome → Constraints → Options → RICE → Risks → Plan", "frameworkZH": "明确目标和资源约束 → 列出候选项 → 用 RICE/ROI 比较 → 考虑依赖与风险 → 沟通取舍并执行", "steps": ["1. 框定问题 / Frame: 针对「产品发布延期两周，你如何处理」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。"], "detail": "把候选方案与同一个业务目标绑定，使用 RICE（Reach×Impact×Confidence÷Effort）做初排，再加入客户承诺、技术依赖、风险和可逆性修正。", "metrics": "北极星：目标成果提升；成本：工程人周；ROI：预期增量价值/总投入；护栏：稳定性和客户信任。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Outcome", "Protect trust with stakeholders and customers, and still ship a product that works. Suppose we discover 3 weeks before launch that a payment integration needs a 2-week fix."], ["Constraints", "Marketing has a campaign booked, sales told a few customers, and the team is already at full capacity."], ["Options", "A: delay the full launch 2 weeks. B: launch on the original date with reduced scope, without the affected payment method. C: add people to the work, which usually doesn't help this late. D: launch to a small beta group first, then go wide in 2 weeks."], ["RICE", "Compare the cost of each: what revenue or commitments depend on the date, how many users need the affected payment method, and the risk of launching something broken. If only 10% of users need that method, B or D keeps most of the value."], ["Risks", "The biggest risk is communicating late or vaguely, which hurts trust more than the delay itself. Launching with a known bug in payments is also high risk."], ["Plan", "Tell stakeholders right away with the cause, impact and options, and recommend one, for example D. Align marketing and sales on new messaging. After launch, run a retrospective on why the risk wasn't caught earlier and add a check for it."]], "followup": "你如何向高层汇报延期？", "followupAnswer": "I'd do it early, in writing, and keep it short. Structure: one line on what happened, the impact on customers and business, the options with trade-offs, my recommendation and what I need from them, for example approval to shift the marketing date. I'd also mention what we're changing to prevent this next time. Coming with a recommendation shows ownership, and being direct about the bad news builds credibility. Then I'd follow up with a short status update at each milestone until launch."}, {"id": 61, "category": "产品战略 Strategy", "question": "Netflix 是否应该进入游戏市场", "english": "Should Netflix enter gaming?", "frameworkEN": "Market → Users → Advantage → Economics → Bet → Validation", "frameworkZH": "分析市场规模和变化 → 细分客户与需求 → 竞争优势 → 单位经济模型 → 明确战略选择 → 小规模验证", "steps": ["1. 框定问题 / Frame: 针对「Netflix 是否应该进入游戏市场」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。"], "detail": "明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "metrics": "北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Market", "Gaming is a large market, roughly $180B a year globally, with mobile as the biggest segment. But it is crowded and dominated by established studios and platforms. Netflix's core problem is that subscriber growth is slowing in mature markets, so the real question is whether games help retention and engagement, not whether gaming is big."], ["Users", "Netflix subscribers are mostly casual entertainment seekers, not hardcore gamers. Casual mobile players and families who want something to do between shows are the realistic target. Hardcore console gamers already have strong options and loyalty."], ["Advantage", "Netflix owns popular IP like Stranger Things and Squid Game, a huge subscriber base with no extra acquisition cost, and an ad-free, no in-app purchase model that is rare in mobile gaming. Weaknesses: no gaming DNA, limited distribution on consoles, and players must download separate apps."], ["Economics", "Games are expensive to build, often $10M to $100M for quality titles. Netflix won't charge extra, so value must come from lower churn or more engagement. Example math: if games reduce churn by 0.2 points among 250M members, that's 500K retained subscribers a month, worth roughly $70M to $90M a year."], ["Bet", "Yes, enter, but narrowly: focus on casual and IP-based mobile and TV games that extend popular shows, plus licensed known titles. Don't try to compete with AAA console studios."], ["Validation", "Measure gaming usage among members, retention of game players versus similar non-players, and whether IP games increase show viewing. Use a holdout test in a few markets to prove causal impact on churn before expanding investment."]], "followup": "如果数据显示玩游戏的会员流失率更低，你能直接得出游戏降低流失的结论吗？", "followupAnswer": "No, that's correlation, not causation. Members who play games are likely more engaged already, so they'd have lower churn even without games. To get causal evidence, I'd use a market or user-level holdout where some members don't see games, then compare churn. If that's not possible, I'd use matched comparison: match game players with non-players who had similar viewing behavior, tenure and plan before they started playing, and compare churn after. I'd also look at churn before and after a member starts playing. Only consistent results across methods would make me confident games reduce churn."}, {"id": 62, "category": "产品战略 Strategy", "question": "Spotify 是否应该推出社交功能", "english": "Should Spotify add social?", "frameworkEN": "Market → Users → Advantage → Economics → Bet → Validation", "frameworkZH": "分析市场规模和变化 → 细分客户与需求 → 竞争优势 → 单位经济模型 → 明确战略选择 → 小规模验证", "steps": ["1. 框定问题 / Frame: 针对「Spotify 是否应该推出社交功能」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。"], "detail": "明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "metrics": "北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Market", "Music streaming is mature and competitive, with similar catalogs across Spotify, Apple Music and YouTube Music. Differentiation now comes from personalization and experience. Social features could make Spotify harder to leave, since connections create switching costs."], ["Users", "Younger users discover music through friends and social media, especially TikTok. Many already share Spotify links in other apps, which shows demand. But a large group listens privately and would dislike forced sharing."], ["Advantage", "Spotify has rich listening data, Wrapped proves people love sharing their taste, and features like Blend and Jam already work. It doesn't need to build a full social network, only social layers around music."], ["Economics", "Social features are relatively cheap to build. Value comes from retention and organic acquisition: every shared playlist or Blend exposes non-users to Spotify. Risks are moderation costs and privacy concerns."], ["Bet", "Yes, but focused on small-circle, music-first social: friends' listening, shared playlists, Blend, Jam sessions and in-app sharing with close friends. Avoid building a general public feed that competes with Instagram or TikTok."], ["Validation", "Track the share of users in at least one social connection, retention for connected versus not connected users (with proper causal methods), and referrals from shared content. Guardrails: privacy settings opt-outs and complaints."]], "followup": "如何避免社交功能侵犯用户隐私或让用户反感？", "followupAnswer": "I'd make privacy the default and sharing a choice. Concretely: social features are opt-in, with clear controls like a private session, hiding specific playlists, and choosing who sees your activity. I'd avoid surprises such as suddenly showing your listening history to all followers. I'd test the experience with users, especially younger users and people with sensitive listening habits. And I'd monitor privacy complaints, opt-out rates and sentiment as guardrails. If many users turn features off, it's a signal the design is too pushy."}, {"id": 63, "category": "产品战略 Strategy", "question": "Notion 如何进入企业大客户市场", "english": "Notion enterprise expansion", "frameworkEN": "Market → Users → Advantage → Economics → Bet → Validation", "frameworkZH": "分析市场规模和变化 → 细分客户与需求 → 竞争优势 → 单位经济模型 → 明确战略选择 → 小规模验证", "steps": ["1. 框定问题 / Frame: 针对「Notion 如何进入企业大客户市场」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。"], "detail": "明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "metrics": "北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Market", "Enterprise collaboration software is a large market, with competitors like Confluence, Microsoft SharePoint and Loop, and Google Workspace. Enterprises spend more per seat and stay longer, so moving upmarket can raise revenue a lot."], ["Users", "Two customers: end users (teams who already love Notion bottom-up) and buyers (IT, security and procurement). Notion already has strong bottom-up adoption inside large companies through individual teams. The blocker is the buyer, who needs security, admin and compliance."], ["Advantage", "Product love, flexibility, a strong template ecosystem and AI features. Weaknesses: enterprise trust, permissions at scale, performance with large workspaces and integrations with legacy systems."], ["Economics", "Enterprise deals are larger but need sales teams, longer sales cycles and customer success. Payback is longer, but net revenue retention can be much higher. The cost to build security and admin features is high but reusable."], ["Bet", "Use a land and expand strategy: find companies with many existing Notion users, then sell a company-wide plan with enterprise features. Invest in SSO, SCIM, audit logs, data residency, granular permissions and admin analytics."], ["Validation", "Track the number of enterprise accounts, average contract value, expansion rate, net revenue retention, and security review pass rate. Start with a few design partners in tech companies, then expand to regulated industries."]], "followup": "企业客户经常说“我们已经有 Confluence 了”，你会怎么说服他们换？", "followupAnswer": "I wouldn't lead with 'switch everything.' I'd show evidence that their teams already chose Notion, for example 'you have 800 people across 12 teams using Notion today.' Then position it as consolidating and securing what's already happening, giving IT control over shadow usage. I'd show where Notion is stronger: flexibility, ease of use, AI and faster adoption, with data from similar customers. I'd also lower switching costs with migration tools and a pilot for one department. And I'd help the champion build an ROI case. The pitch is less 'replace Confluence' and more 'standardize what your people already prefer.'"}, {"id": 64, "category": "产品战略 Strategy", "question": "一家 B2B SaaS 如何制定 PLG 战略", "english": "B2B SaaS PLG strategy", "frameworkEN": "Market → Users → Advantage → Economics → Bet → Validation", "frameworkZH": "分析市场规模和变化 → 细分客户与需求 → 竞争优势 → 单位经济模型 → 明确战略选择 → 小规模验证", "steps": ["1. 框定问题 / Frame: 针对「一家 B2B SaaS 如何制定 PLG 战略」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。"], "detail": "明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "metrics": "北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Market", "PLG works when the product can deliver value quickly without sales help, and when users can adopt it individually or in small teams. I'd assume we sell a project management tool to mid-market companies through sales today."], ["Users", "End users who feel the pain daily, like project managers and team leads, versus economic buyers. PLG starts with the user: they try it, love it, invite teammates, then upgrade."], ["Advantage", "If our product has a fast time to value, collaborative features that spread naturally, and clear upgrade triggers, PLG fits. If setup requires heavy integration, PLG is harder."], ["Economics", "PLG lowers acquisition cost but requires investment in onboarding, self-serve billing and growth teams. Conversion from free to paid is often 2% to 5%, so we need high top-of-funnel volume. Combine with sales for larger deals."], ["Bet", "Build a freemium or trial with a clear activation path, viral loops like invites and sharing, usage-based upgrade triggers, and product-qualified leads for sales to follow up."], ["Validation", "Track sign-ups, activation rate, invite rate, free to paid conversion, and PQL to deal conversion. Compare CAC and payback with sales-led channels."]], "followup": "免费版应该放哪些功能、限制哪些功能？", "followupAnswer": "The free plan should deliver real value so users experience the core 'aha' moment, otherwise they never get to the upgrade decision. I'd include the core workflow fully, limited by scale, for example a number of projects, users, or storage. I'd put features that matter to growing teams or companies into paid plans: advanced permissions, admin controls, integrations, analytics, and SSO. The limit should be hit at a moment when the team is getting value, so upgrading feels natural. I'd test limits by looking at where users hit them and how conversion changes."}, {"id": 65, "category": "产品战略 Strategy", "question": "ChatGPT 如何服务中小企业团队", "english": "ChatGPT for SMB teams", "frameworkEN": "Market → Users → Advantage → Economics → Bet → Validation", "frameworkZH": "分析市场规模和变化 → 细分客户与需求 → 竞争优势 → 单位经济模型 → 明确战略选择 → 小规模验证", "steps": ["1. 框定问题 / Frame: 针对「ChatGPT 如何服务中小企业团队」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。"], "detail": "明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "metrics": "北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Market", "SMBs are a huge but fragmented market. Many SMB teams already use ChatGPT individually, but without shared workspaces, admin, or integration into their tools."], ["Users", "Owners and managers who want productivity gains, and employees who use AI for writing, analysis and customer communication. Their needs: simple setup, affordable pricing, privacy, and ready-to-use workflows."], ["Advantage", "Brand awareness, strong models, and many existing individual users who can bring ChatGPT into their teams. Gaps: SMB-specific workflows, integrations with SMB tools like QuickBooks or Shopify, and support."], ["Economics", "SMBs are price sensitive and churn more, so self-serve sales and low support cost are essential. Pricing per seat with a team plan works."], ["Bet", "Offer a team plan with shared workspace, templates for common SMB tasks like marketing copy and customer replies, simple admin and data privacy, plus integrations with popular SMB tools."], ["Validation", "Track team plan adoption, seats per team, weekly active users per team, retention and expansion. Run pilots with SMBs in specific industries like agencies and ecommerce."]], "followup": "中小企业流失率高，你会怎么提升团队版的留存？", "followupAnswer": "I'd focus on making ChatGPT part of the team's routine work. First, onboarding with role-specific templates, so each employee finds a use case in week one. Second, shared assets: team prompts, custom GPTs and knowledge that build value over time and make leaving costly. Third, integrations with tools they use daily. Fourth, simple usage reports for the owner showing time saved and adoption. I'd measure seat activation and weekly usage per team as leading indicators, and reach out to teams where usage drops."}, {"id": 66, "category": "产品战略 Strategy", "question": "AI 搜索创业公司如何与 Google 竞争", "english": "AI search startup vs Google", "frameworkEN": "Market → Users → Advantage → Economics → Bet → Validation", "frameworkZH": "分析市场规模和变化 → 细分客户与需求 → 竞争优势 → 单位经济模型 → 明确战略选择 → 小规模验证", "steps": ["1. 框定问题 / Frame: 针对「AI 搜索创业公司如何与 Google 竞争」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。"], "detail": "明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "metrics": "北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Market", "Search is huge, with Google holding around 90% share. But AI is changing search behavior, especially for complex questions, research and comparisons. That creates an opening for new players."], ["Users", "Early adopters: developers, researchers, students and professionals who ask complex questions and value direct answers with sources. Not the average user searching for weather or a restaurant."], ["Advantage", "A startup can move faster, design an AI-native experience, and avoid the conflict Google has with its ads business. Focus on answer quality, citations, no ad clutter, and specialized verticals."], ["Economics", "AI search queries cost much more than traditional search. A subscription model for power users or an API business can cover costs. Ads are harder at small scale."], ["Bet", "Win a niche first: for example research, coding, or professional queries, where quality differences are obvious and users pay. Build trust through accurate citations. Distribution through browser extensions, partnerships and word of mouth."], ["Validation", "Track weekly active users, queries per user, retention, paid conversion and cost per query. Compare satisfaction with Google for target query types."]], "followup": "Google 也在做 AI 搜索，你的创业公司怎么保持差异化？", "followupAnswer": "I'd compete where Google is structurally constrained. Google's business depends on ads and clicks to publishers, so it can't fully remove ads or keep users from clicking out. A startup can offer a cleaner, ad-free answer experience. Second, specialize: be the best for a vertical like academic research or developer questions, with domain-specific sources and features. Third, build workflow features like saving research, collaboration and exports that go beyond search. Fourth, move faster with new models and features. The goal isn't to beat Google broadly, but to be clearly better for a specific group who pays."}, {"id": 67, "category": "产品战略 Strategy", "question": "何时应该从单一产品扩展到平台", "english": "When expand from product to platform", "frameworkEN": "Market → Users → Advantage → Economics → Bet → Validation", "frameworkZH": "分析市场规模和变化 → 细分客户与需求 → 竞争优势 → 单位经济模型 → 明确战略选择 → 小规模验证", "steps": ["1. 框定问题 / Frame: 针对「何时应该从单一产品扩展到平台」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。"], "detail": "明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "metrics": "北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Market", "A product becomes a platform when outside parties can create value on top of it that we could never build alone. I'd use a concrete case: a scheduling SaaS with 50,000 business customers, where customers keep asking for integrations with niche tools like salon POS systems or clinic software."], ["Users", "Two sides now. End customers want the product to fit their specific workflow. Developers and partners want access to our 50,000 businesses as a distribution channel. Both must win, or the platform stays empty."], ["Advantage", "Signs we're ready: strong product-market fit and retention in the core product; a request backlog for integrations far larger than our team can build; partners or customers already building workarounds with scraped data or Zapier. Without these, a platform is a cost center with no developers."], ["Economics", "Investment includes public APIs, auth and permissions, developer docs, sandbox, a marketplace and partner support, roughly a dedicated team of 6 to 10 people. Returns: higher retention for customers using integrations (often 20% to 30% lower churn), new segments served without our own build, and possibly revenue share."], ["Bet", "Open in stages. Stage 1: stable public API and 10 high-demand integrations we build or co-build with launch partners. Stage 2: marketplace and self-serve developer onboarding. Stage 3: revenue share and featured listings. Each stage needs proof before the next."], ["Validation", "Metrics: number of active third-party integrations, share of customers using at least one, churn of integrated versus non-integrated customers with similar profiles, developer activation (first API call to live app), and partner-sourced revenue."]], "followup": "平台化之后，第三方开发者做出质量差的应用影响用户体验，你会怎么管？", "followupAnswer": "Users will blame us for a bad app on our platform, so quality is our job. I'd use three layers. Before listing: a review covering security, data permissions, performance and basic UX, with a clear checklist so developers know the bar. After listing: monitor ratings, error rates, uninstall rate and support tickets per app, and share a quality dashboard with each developer. Enforcement: low quality apps rank lower in search, get warnings, and are removed if issues continue, with transparent rules. I'd also invest in good docs, SDKs and examples, since most bad apps come from developers who lack guidance rather than bad intent. The goal is a strict but predictable system that protects users and keeps good developers motivated."}, {"id": 68, "category": "产品战略 Strategy", "question": "如何评估进入一个新国家市场", "english": "Enter a new country", "frameworkEN": "Market → Users → Advantage → Economics → Bet → Validation", "frameworkZH": "分析市场规模和变化 → 细分客户与需求 → 竞争优势 → 单位经济模型 → 明确战略选择 → 小规模验证", "steps": ["1. 框定问题 / Frame: 针对「如何评估进入一个新国家市场」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。"], "detail": "明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "metrics": "北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Market", "I'll use a case: a US personal finance app deciding whether to enter Brazil. Market signals: over 200M people, very high smartphone use, and fast digital payments adoption with Pix. But the market already has strong digital banks like Nubank, so size alone doesn't mean opportunity."], ["Users", "I'd study what Brazilian users need that's unsolved. For example, many people pay in installments ('parcelado'), which makes budgeting harder; our insight might be helping users see future installment commitments. That job may differ from the US, so I'd do local interviews before deciding."], ["Advantage", "Our edge must be clear: a budgeting experience that tracks installments well, strong design, or partnerships. If our main strength only matters in the US, like US bank integrations, we have no edge there."], ["Economics", "Estimate CAC through local channels, revenue per user (Brazilian users typically pay less than US users), localization cost, legal and data protection (LGPD) compliance, and local support. Then calculate payback period and compare to our US payback."], ["Bet", "Enter only if there is a clear unmet need, a real edge and payback within an acceptable period, say under 24 months. Start with one segment, such as young professionals in São Paulo, and one strong use case."], ["Validation", "Soft launch for 3 months: track CAC, activation, retention at D30 and D90, and willingness to pay. Set go or no go thresholds before launching so the decision is objective."]], "followup": "进入新国家时，你会怎么决定本地化做到什么程度？", "followupAnswer": "I'd separate localization into three levels. Must-have, before launch: language that sounds natural (not machine translation), local currency, local payment methods like Pix, and legal compliance. Without these, users can't get value. Should-have, decided by research: local features that serve a different job, like installment tracking, and local customer support hours. Nice-to-have, decided by data after launch: local partnerships, cultural content and marketing. I'd use early user feedback and funnel data to see where adoption breaks, and invest localization where it unblocks the most users. Over-localizing too early is slow and expensive, while under-localizing makes the product feel foreign and hurts trust."}, {"id": 69, "category": "产品战略 Strategy", "question": "如何选择 AI Agent 产品的首个垂直行业", "english": "Choose first AI agent vertical", "frameworkEN": "Market → Users → Advantage → Economics → Bet → Validation", "frameworkZH": "分析市场规模和变化 → 细分客户与需求 → 竞争优势 → 单位经济模型 → 明确战略选择 → 小规模验证", "steps": ["1. 框定问题 / Frame: 针对「如何选择 AI Agent 产品的首个垂直行业」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。"], "detail": "明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "metrics": "北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Market", "I'd score candidate verticals on four factors: spend on the work the agent would replace, volume of repetitive tasks, digital readiness (systems with APIs), and risk of errors. Candidates: customer support, accounts payable, insurance claims, legal contract review, healthcare admin."], ["Users", "The best first users do high-volume, rule-based work with structured inputs and clear success criteria. In accounts payable, for example, clerks match invoices to purchase orders and enter data into ERP systems, spending hours on repetitive checks."], ["Advantage", "We should pick a vertical where our team has domain knowledge, data access or integration experience. If we've built ERP connectors before, finance operations is a natural fit."], ["Economics", "Estimate ROI for customers: a mid-size company processes 5,000 invoices a month at about $10 of labor each; if an agent handles 70% at $1 each, savings are about $30K a month. That supports a strong price. Compare against implementation cost and sales cycle length."], ["Bet", "Pick accounts payable for mid-size companies: clear ROI, measurable outcomes, moderate risk with human approval for exceptions, and existing systems with APIs. Leave healthcare and legal for later, since they need more compliance and trust."], ["Validation", "Run pilots with 5 design partners. Track straight-through processing rate, accuracy versus human baseline, time saved, exceptions sent to humans, and conversion from pilot to paid contract."]], "followup": "为什么不选医疗这种市场更大的行业？", "followupAnswer": "Healthcare is attractive in size, but it's a poor first vertical for us. Errors are high risk and can harm patients, so customers require extensive validation. Regulations like HIPAA add compliance work before we can even pilot. Sales cycles in hospitals often take 12 to 18 months, so we'd learn too slowly. And systems like EHRs are hard to integrate with. A first vertical should let us prove the product quickly, show clear ROI, and build references. Once we have a reliable agent, an evaluation process and a track record, we can enter healthcare with much more credibility, for example starting with lower risk admin tasks like insurance verification."}, {"id": 70, "category": "产品战略 Strategy", "question": "面对低价竞品应该降价吗", "english": "Respond to low-price competitor", "frameworkEN": "Market → Users → Advantage → Economics → Bet → Validation", "frameworkZH": "分析市场规模和变化 → 细分客户与需求 → 竞争优势 → 单位经济模型 → 明确战略选择 → 小规模验证", "steps": ["1. 框定问题 / Frame: 针对「面对低价竞品应该降价吗」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。"], "detail": "明确市场与客户细分、JTBD、现有替代方案和差异化优势；估算 TAM/SAM/SOM 与获客成本、毛利和回本周期，提出可验证的进入或不进入判断。", "metrics": "北极星：目标客户成功价值事件或净收入留存；护栏：CAC 回本期、毛利率、流失率。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Market", "Suppose we sell a team collaboration tool at $12 per seat, and a new competitor offers a similar product at $5. I'd first understand them: who they target, whether their price is sustainable (funded by venture money, or a structurally cheaper product), and how fast they're growing."], ["Users", "Then I'd look at our own customers. Where are we losing? Win and loss data might show we're losing small teams under 10 seats, while mid-market accounts stay. Churn interviews tell us whether price is the real reason or a convenient excuse."], ["Advantage", "List what customers get from us beyond price: integrations, reliability, admin controls, support and ecosystem. If enterprise customers value these, the competitor isn't really competing for them."], ["Economics", "A full price cut to $5 would cut revenue from all existing customers by about 58% to defend a segment that may be a small part of revenue. I'd calculate: revenue at risk from the price-sensitive segment versus revenue lost by cutting price for everyone."], ["Bet", "Usually, don't match the price across the board. Instead: launch a lighter, cheaper plan for small teams, strengthen the features that justify our price for larger customers, and improve messaging on total value."], ["Validation", "Track win rate against the competitor by segment, churn reasons, adoption of the new plan, and whether it cannibalizes our main plan. Revisit if losses spread to core segments."]], "followup": "如果确实有大量客户因为价格流失，你会怎么调整？", "followupAnswer": "First I'd check which customers are leaving and whether they're profitable. If losses concentrate in small teams, a targeted lower tier with limits, like fewer integrations or seats, keeps them without discounting everyone. If losses are spreading to core segments, price is a broader problem, and I'd review packaging: maybe customers pay for features they don't use, so a modular plan could lower their cost while keeping our margins. I'd also check whether we can lower our own costs to compete. Any change would be tested in a limited group first, with metrics like churn, conversion, ARPU and gross margin, so we don't start a price war we can't win."}, {"id": 71, "category": "AI PM / Technical PM", "question": "如何设计企业内部 Text2SQL Agent", "english": "Design Text2SQL agent", "frameworkEN": "Workflow → Baseline → Architecture → Evals → Guardrails → ROI", "frameworkZH": "拆解用户工作流和人工基线 → 选择模型与工具架构 → 设计离线评测 → 线上护栏与人工兜底 → 计算单任务成本与收益", "steps": ["1. 框定问题 / Frame: 针对「如何设计企业内部 Text2SQL Agent」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。"], "detail": "从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "metrics": "北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Workflow", "Users are business people, like sales managers, who want answers from company data without writing SQL. Today they send a request to the data team and wait 2 to 3 days. The workflow: ask a question in plain language → agent finds the right tables → writes SQL → runs it → shows a chart and explanation → user asks a follow-up."], ["Baseline", "Measure the current process: average time to answer (for example 2.5 days), number of requests per week, and analyst hours spent on simple questions. Roughly 60% of requests are repeat-style questions like 'revenue by region last quarter', which is the target."], ["Architecture", "LLM plus a semantic layer: a curated set of metric definitions and table descriptions, so 'revenue' always means the same thing. Retrieval to pick relevant tables and examples. SQL generation, validation (syntax, read-only, row limits), execution on a warehouse with the user's permissions, then a summary. Show the SQL so users or analysts can check it."], ["Evals", "Build a golden set of 300 real questions with correct SQL and results. Measure execution accuracy (result matches the correct answer), not just SQL that runs. Break down by question difficulty: single table, joins, time logic. Re-run evals with every prompt or model change."], ["Guardrails", "Read-only access, row-level permissions, query cost limits, and refusing questions with unclear metrics instead of guessing. Confidence indicator and 'ask an analyst' fallback. Log every query for audit."], ["ROI", "If the agent handles 60% of 200 weekly requests, that saves about 120 requests times 1 analyst hour each, so 120 hours a week, plus business users get answers in minutes. Compare with LLM and warehouse query costs, which are usually small per query."]], "followup": "如果 SQL 能跑通但结果是错的（比如口径错了），用户也看不出来，你怎么防范？", "followupAnswer": "This is the most dangerous failure because it looks correct. I'd prevent it in layers. First, a semantic layer with approved metric definitions, so the agent uses 'net revenue' as defined by finance rather than inventing its own formula. Second, the answer explains its logic in plain language, like 'revenue = paid orders minus refunds, Jan to Mar, all regions', so users can catch wrong assumptions. Third, sanity checks: compare results against known dashboards, and flag big differences. Fourth, ask clarifying questions when terms are ambiguous. Fifth, sample and review answers with analysts weekly and add mistakes to the eval set. I'd track 'silent error rate' from those reviews as a key quality metric."}, {"id": 72, "category": "AI PM / Technical PM", "question": "如何评估 RAG 搜索系统质量", "english": "Evaluate RAG quality", "frameworkEN": "Workflow → Baseline → Architecture → Evals → Guardrails → ROI", "frameworkZH": "拆解用户工作流和人工基线 → 选择模型与工具架构 → 设计离线评测 → 线上护栏与人工兜底 → 计算单任务成本与收益", "steps": ["1. 框定问题 / Frame: 针对「如何评估 RAG 搜索系统质量」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。"], "detail": "从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "metrics": "北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Workflow", "A RAG system answers questions using retrieved documents. The flow: user question → retrieve relevant chunks → model generates an answer with citations. Quality can fail at retrieval (wrong documents) or at generation (wrong use of good documents)."], ["Baseline", "Compare with what users do today, like keyword search or asking colleagues: time to answer and success rate. This sets the bar the RAG system needs to beat."], ["Architecture", "Evaluate each part separately: the retriever (embedding model, chunking, hybrid keyword plus vector search, re-ranking) and the generator (model, prompt, citation format). Separating them shows where to fix problems."], ["Evals", "Retrieval: recall@k (does the right document appear in the top k results) and precision. Generation: faithfulness (is every claim supported by the retrieved text), answer correctness versus a reference, citation accuracy, and completeness. Use a golden set of 200 to 500 real questions labeled by experts, plus LLM-as-judge for scale, calibrated against human ratings."], ["Guardrails", "Answer 'I don't know' when retrieval confidence is low. Respect document permissions. Monitor content freshness so outdated policies aren't cited."], ["ROI", "Online signals: thumbs up and down, follow-up rate, escalation to humans, and time saved. Combine offline quality scores with online behavior to decide on changes."]], "followup": "LLM-as-judge 评测靠得住吗？你怎么确保它准确？", "followupAnswer": "It's useful for scale but not reliable by default. I'd calibrate it: have human experts label a sample of 100 to 200 answers, run the LLM judge on the same set, and measure agreement. If agreement is high, say above 85%, it's usable for that criterion. I'd use clear rubrics with specific questions like 'is every claim supported by the cited text?' instead of 'is this a good answer?'. I'd watch for known biases, like preferring longer answers or answers from the same model family. And I'd re-check agreement periodically, especially after changing the judge model. Human review stays the source of truth for high-stakes decisions."}, {"id": 73, "category": "AI PM / Technical PM", "question": "如何设计语音助手的多轮对话体验", "english": "Design multi-turn voice assistant", "frameworkEN": "Workflow → Baseline → Architecture → Evals → Guardrails → ROI", "frameworkZH": "拆解用户工作流和人工基线 → 选择模型与工具架构 → 设计离线评测 → 线上护栏与人工兜底 → 计算单任务成本与收益", "steps": ["1. 框定问题 / Frame: 针对「如何设计语音助手的多轮对话体验」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。"], "detail": "从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "metrics": "北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Workflow", "Example: an in-car voice assistant. Drivers want to do tasks hands-free, like navigation, calls, music and climate, often in multiple steps: 'find a coffee shop on the way... the second one... and text Sarah I'll be 10 minutes late.'"], ["Baseline", "Measure current task completion and turns per task. Common failures: losing context ('the second one' isn't understood), misrecognition in noise, and long responses that distract the driver."], ["Architecture", "Speech recognition tuned for car noise, an LLM for understanding with conversation state (keeping track of entities like the list of coffee shops), tool calls to navigation, phone and media, and text-to-speech with short responses. A dialog manager decides when to confirm, when to ask, and when to just act."], ["Evals", "Task success rate for multi-step scenarios, context retention accuracy (correctly resolving references like 'it' or 'the second one'), word error rate in noise, latency from end of speech to response, and number of turns. Test in realistic noise and with accents."], ["Guardrails", "Safety first: short responses, confirm before irreversible actions like sending messages, avoid visual demands while driving. Fall back gracefully: 'Sorry, I didn't get that, did you mean A or B?'"], ["ROI", "Value: fewer distractions, higher satisfaction and usage. Track tasks per drive, repeat usage and error rates."]], "followup": "多轮对话中，用户中途改变主意（比如“算了，换一家”），系统应该怎么处理？", "followupAnswer": "The system should treat it as normal, not as an error. The dialog state should allow corrections: when the user says 'never mind, a different one', the assistant keeps the original goal (find a coffee shop on the route) but drops the current selection and offers the next option. To do that well, the state needs to track the goal, the options shown and the current selection separately. I'd build eval scenarios specifically for corrections, cancellations and topic switches, and measure how often the assistant handles them without the user starting over. Also, responses should be quick and short, since in a car the user can't look at a screen to fix things."}, {"id": 74, "category": "AI PM / Technical PM", "question": "如何处理 LLM 幻觉与错误答案", "english": "Reduce LLM hallucinations", "frameworkEN": "Workflow → Baseline → Architecture → Evals → Guardrails → ROI", "frameworkZH": "拆解用户工作流和人工基线 → 选择模型与工具架构 → 设计离线评测 → 线上护栏与人工兜底 → 计算单任务成本与收益", "steps": ["1. 框定问题 / Frame: 针对「如何处理 LLM 幻觉与错误答案」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。"], "detail": "从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "metrics": "北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Workflow", "Start with where hallucinations hurt users. In a customer support bot, a made-up refund policy creates real cost. In a brainstorming tool, creativity is fine. So I'd identify high-risk use cases first."], ["Baseline", "Measure the current hallucination rate: sample 200 answers, have reviewers label unsupported or false claims, and break down by topic and question type."], ["Architecture", "Ground answers in sources with RAG, so the model answers from company documents. Instruct the model to say 'I don't know' when information isn't available. Use structured outputs and tool calls for facts like prices or order status instead of model memory. For high-risk topics, add a verification step that checks claims against sources."], ["Evals", "Faithfulness score (claims supported by sources), factual accuracy on a golden set, and refusal accuracy (does it decline when it should, but not too often). Track by category."], ["Guardrails", "Show citations so users can verify. Add disclaimers for sensitive areas. Human review for high-risk outputs. Collect user reports of wrong answers and feed them into evals."], ["ROI", "Lower hallucination rate reduces support escalations, refunds and trust damage. Balance with helpfulness: too many refusals frustrate users."]], "followup": "如果减少幻觉的措施导致模型频繁回答“我不知道”，用户不满意，怎么办？", "followupAnswer": "That's the trade-off between safety and helpfulness, and both are failures. I'd measure both: hallucination rate and unnecessary refusal rate, where the answer existed in the sources. If refusals are high, the cause is often retrieval: the right document exists but isn't found, so I'd improve search and chunking. I'd also make refusals more useful: instead of 'I don't know', say what's known, ask a clarifying question, or route to a human or a relevant page. And I'd tune thresholds by topic, so low-risk questions get more lenient answers while high-risk ones stay strict."}, {"id": 75, "category": "AI PM / Technical PM", "question": "如何设计 Human-in-the-loop 审核流程", "english": "Design human-in-loop review", "frameworkEN": "Workflow → Baseline → Architecture → Evals → Guardrails → ROI", "frameworkZH": "拆解用户工作流和人工基线 → 选择模型与工具架构 → 设计离线评测 → 线上护栏与人工兜底 → 计算单任务成本与收益", "steps": ["1. 框定问题 / Frame: 针对「如何设计 Human-in-the-loop 审核流程」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。"], "detail": "从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "metrics": "北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Workflow", "Example: an AI system that reviews insurance claims. AI handles routine claims, humans review uncertain or high-value ones. The workflow: claim submitted → AI extracts info and scores → route by confidence and risk → human reviews if needed → decision → feedback to model."], ["Baseline", "Current process: claims per reviewer per day, average processing time, error rate and cost per claim."], ["Architecture", "AI model with confidence scores; routing rules (for example, claims over $10,000 or confidence below 0.85 go to a human); a review interface that shows AI reasoning and highlights key fields so reviewers work faster; and a feedback loop where reviewer corrections are logged."], ["Evals", "Accuracy of auto-approved claims, share of claims auto-processed, human-AI agreement rate, and reviewer time per claim. Audit a random sample of auto-approved claims regularly."], ["Guardrails", "Avoid automation bias, where humans just click 'approve.' Mix in known test cases to check reviewer attention, track override rates. Clear accountability: humans own final decisions for high-risk cases."], ["ROI", "If 60% of claims are auto-processed accurately and reviewers handle the rest 30% faster with AI support, cost per claim drops significantly. Calculate savings versus model and implementation costs."]], "followup": "如何设定人工审核的阈值？阈值太高或太低会怎样？", "followupAnswer": "I'd set it using data on accuracy at different confidence levels. Plot accuracy versus confidence: if claims above 0.9 confidence are 99% accurate, that's a safe auto-approve zone. If the threshold is too low, more errors get through without review, creating financial and trust risk. If it's too high, almost everything goes to humans, and we lose efficiency. I'd start conservative, measure error rates in audits, and gradually lower the threshold as accuracy is proven. Different thresholds for different risk levels, like claim amount, make sense too."}, {"id": 76, "category": "AI PM / Technical PM", "question": "如何衡量 AI 产品每任务成本和 ROI", "english": "Calculate AI cost and ROI", "frameworkEN": "Workflow → Baseline → Architecture → Evals → Guardrails → ROI", "frameworkZH": "拆解用户工作流和人工基线 → 选择模型与工具架构 → 设计离线评测 → 线上护栏与人工兜底 → 计算单任务成本与收益", "steps": ["1. 框定问题 / Frame: 针对「如何衡量 AI 产品每任务成本和 ROI」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。"], "detail": "从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "metrics": "北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Workflow", "Example: an AI email drafting feature in a CRM. Each task is 'draft a reply to a customer email.'"], ["Baseline", "Without AI, a sales rep spends about 6 minutes per reply. With AI drafts, maybe 2 minutes to review and edit."], ["Architecture", "Cost per task includes model input and output tokens, retrieval or tool calls, and infrastructure. Example: 3,000 input tokens and 500 output tokens per draft. Depending on the model, cost might be $0.01 to $0.05 per draft."], ["Evals", "Measure accepted draft rate (sent with few edits) and time saved per task, since a draft that's rewritten saves little."], ["Guardrails", "Watch for cost spikes: long contexts, retries and runaway agent loops. Set per-user limits and monitoring. Route simple tasks to cheaper models."], ["ROI", "Value per task: 4 minutes saved × $40 per hour = about $2.70. Cost: about $0.03. ROI per task is very high. At 10,000 drafts a month, savings of $27K versus $300 in model cost. Include development and maintenance costs to get full ROI. Report conservative estimates."]], "followup": "如果模型成本占收入比例越来越高，你会怎么优化？", "followupAnswer": "I'd analyze where cost comes from: which features, which users, and which parts of the prompt. Common levers: shorten prompts and context, use caching for repeated content, route simple tasks to smaller models, limit retries, and batch requests where latency doesn't matter. On the business side, I'd align pricing with usage, for example limits on free tiers or usage-based pricing for heavy users. I'd track cost per successful task and gross margin per feature as key metrics."}, {"id": 77, "category": "AI PM / Technical PM", "question": "如何选择 Prompt、RAG 或 Fine-tuning", "english": "Choose prompt vs RAG vs fine-tuning", "frameworkEN": "Workflow → Baseline → Architecture → Evals → Guardrails → ROI", "frameworkZH": "拆解用户工作流和人工基线 → 选择模型与工具架构 → 设计离线评测 → 线上护栏与人工兜底 → 计算单任务成本与收益", "steps": ["1. 框定问题 / Frame: 针对「如何选择 Prompt、RAG 或 Fine-tuning」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。"], "detail": "从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "metrics": "北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Workflow", "Start with the problem. Example: a legal tech company wants AI to answer questions about contracts and draft clauses in their firm's style."], ["Baseline", "Try the simplest option first: a well-written prompt with a strong model. Measure quality on a test set."], ["Architecture", "Prompt engineering: fastest and cheapest, good when the model already knows how to do the task. RAG: when the model needs specific, changing knowledge, like the firm's contracts or policies; it also gives citations. Fine-tuning: when you need a consistent style, format or specialized behavior that prompting can't achieve reliably, or to lower cost and latency with a smaller model."], ["Evals", "Compare options on the same eval set: accuracy, style consistency, latency, cost. For this case: contract questions need RAG (specific knowledge); clause drafting in firm style may need fine-tuning if prompts with examples are not consistent enough."], ["Guardrails", "RAG needs access control for documents; fine-tuning needs good training data and careful handling of sensitive information."], ["ROI", "Prompt is cheapest; RAG requires building retrieval infrastructure; fine-tuning requires data preparation and retraining when models update. Choose the simplest that meets quality needs."]], "followup": "什么情况下你会同时用 RAG 和 Fine-tuning？", "followupAnswer": "When the task needs both specific, changing knowledge and a consistent behavior or style. For example, a support assistant that must answer from the latest product docs (RAG) and respond in a specific tone and format every time (fine-tuning). RAG provides facts; fine-tuning shapes how the model uses them. I'd still start with RAG plus prompting, and add fine-tuning only if evals show style or format issues prompting can't fix."}, {"id": 78, "category": "AI PM / Technical PM", "question": "如何设计 AI Agent 的工具调用失败兜底", "english": "Handle agent tool failure", "frameworkEN": "Workflow → Baseline → Architecture → Evals → Guardrails → ROI", "frameworkZH": "拆解用户工作流和人工基线 → 选择模型与工具架构 → 设计离线评测 → 线上护栏与人工兜底 → 计算单任务成本与收益", "steps": ["1. 框定问题 / Frame: 针对「如何设计 AI Agent 的工具调用失败兜底」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。"], "detail": "从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "metrics": "北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Workflow", "Example: a travel booking agent that searches flights, holds seats, books hotels and charges a card. Each tool call can fail: timeouts, rate limits, invalid inputs, sold-out inventory or a provider outage. A multi-step plan with 5 tools and 97% reliability each only succeeds about 86% of the time without good recovery."], ["Baseline", "Measure failure rate per tool and error type, and how many tool failures lead to task failure or to a confusing message. This shows where fallback work has the biggest impact."], ["Architecture", "Design fallback by error type. Temporary errors: retry with backoff, with a limit. Invalid inputs: validate before calling, and ask the user when information is missing. Unavailable inventory: re-plan with alternatives, like another flight. Provider outage: switch to a backup provider or return a partial result ('I found your flight, hotel search is down, want me to try again in 10 minutes?'). Keep state so the agent can resume instead of starting over."], ["Evals", "Fault injection testing: deliberately simulate timeouts, errors and bad data in a test environment and check whether the agent recovers, re-plans or explains clearly. Metrics: recovery rate, correct escalation rate, and user-rated clarity of failure messages."], ["Guardrails", "Never claim success when a tool failed; verify results after each critical call. Use idempotency keys so retries don't create double bookings or charges. Escalate to a human for payment or irreversible failures."], ["ROI", "Better recovery increases task success, reduces support tickets and builds trust, which drives repeat usage. Even a few points of extra success rate can matter a lot at scale."]], "followup": "如果 Agent 在执行支付这种不可逆操作时出错，怎么设计兜底？", "followupAnswer": "For irreversible actions, I'd design to prevent errors first. Require explicit user confirmation with a clear summary before payment. Use idempotency keys so retries don't double charge. Verify results after the call: check payment status before telling the user it's done. If something fails midway, the agent should report the exact state and next steps, and escalate to human support. Log every step for audit. Also limit the agent's permissions, for example spending caps."}, {"id": 79, "category": "AI PM / Technical PM", "question": "如何设计多模态作品评审系统", "english": "Design multimodal portfolio review", "frameworkEN": "Workflow → Baseline → Architecture → Evals → Guardrails → ROI", "frameworkZH": "拆解用户工作流和人工基线 → 选择模型与工具架构 → 设计离线评测 → 线上护栏与人工兜底 → 计算单任务成本与收益", "steps": ["1. 框定问题 / Frame: 针对「如何设计多模态作品评审系统」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。"], "detail": "从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "metrics": "北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Workflow", "Example: a design school gets 5,000 portfolio applications a year. Reviewers spend about 20 minutes each, and feedback is inconsistent. The AI system would analyze images, project descriptions and process documentation, then give structured scores and feedback to support human reviewers."], ["Baseline", "Measure today: time per portfolio, agreement between two human reviewers on the same portfolio (often only moderate), and applicant satisfaction with feedback. This tells us the bar AI must reach."], ["Architecture", "A multimodal model analyzes each project using a rubric written with faculty: visual composition, craft, concept clarity, process and storytelling. It outputs scores per criterion with evidence ('the layout in project 2 has clear hierarchy'), and flags uncertainty. Humans see the AI summary next to the portfolio and make the final decision."], ["Evals", "Build a labeled set of 300 past portfolios scored by experienced faculty. Measure AI-to-expert agreement per criterion and compare with expert-to-expert agreement. Rate feedback usefulness with applicants and reviewers. Test stability: the same portfolio should get similar scores across runs."], ["Guardrails", "Bias testing across styles, cultures, media types and file quality, since phone photos versus professional photos shouldn't change design scores. No automatic rejection: AI supports, humans decide. Be transparent with applicants about how AI is used."], ["ROI", "If reviewers save 8 minutes per portfolio, that's about 650 hours a year, and every applicant can get written feedback, which was not possible before. Compare with model and implementation costs."]], "followup": "如何确保 AI 评审对不同风格的作品公平？", "followupAnswer": "I'd build fairness into the evaluation, not assume it. First, create an evaluation set that deliberately includes different styles (minimal, illustrative, experimental), cultural backgrounds, media (digital, physical, motion) and presentation quality. Second, compare AI scores with expert scores within each group: if AI consistently scores one style lower than experts do, that's bias. Third, write rubrics around principles like hierarchy, clarity and intent, rather than taste, and have the model cite evidence for each score. Fourth, normalize for presentation quality, for example checking that photo quality isn't driving scores. Finally, keep humans in charge of decisions, audit outcomes by group every cycle, and give applicants a way to flag unfair feedback."}, {"id": 80, "category": "AI PM / Technical PM", "question": "如何为 AI 功能建立离线与线上评测体系", "english": "Build offline and online AI evals", "frameworkEN": "Workflow → Baseline → Architecture → Evals → Guardrails → ROI", "frameworkZH": "拆解用户工作流和人工基线 → 选
