择模型与工具架构 → 设计离线评测 → 线上护栏与人工兜底 → 计算单任务成本与收益", "steps": ["1. 框定问题 / Frame: 针对「如何为 AI 功能建立离线与线上评测体系」，先澄清目标用户、成功定义、时间范围和限制。", "2. 结构化拆解 / Decompose: 从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "3. 做出选择 / Decide: 比较至少两种解释或方案，给出取舍依据、风险和最小验证方案。", "4. 量化验证 / Measure: 北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。"], "detail": "从真实用户任务定义输入、工具、输出和人工介入点；建立 golden set，按任务成功率、准确率、引用有效性、延迟和成本评估，分开离线评测与线上真实使用。", "metrics": "北极星：每周成功完成的 AI 任务；护栏：幻觉率、P95 延迟、人工接管率、每任务成本。", "pitfalls": ["直接跳到功能或结论，没有澄清业务目标与用户范围。", "只报一个大盘平均值，没有分群、漏斗和基线。", "没有明确北极星指标、护栏指标与折损点。", "把假设数据当事实，忽略验证成本、风险和 ROI。"], "answer": [["Workflow", "Example: an AI writing assistant inside a document tool that drafts and rewrites text. We need offline evals to decide if a change is safe to ship, and online evals to know if it actually helps real users."], ["Baseline", "Define 'good' with users and experts: helpful (does it complete the request), accurate (no wrong facts), follows instructions (length, tone) and safe. Record current scores so every change is compared with a baseline."], ["Architecture", "Offline: a golden dataset of about 500 real, anonymized requests covering common and edge cases; automatic checks for format and length; LLM-as-judge with rubrics, calibrated with human labels; and a regression suite that runs on every prompt or model change. Online: A/B tests, user signals like accept, edit or regenerate, thumbs feedback, and monitoring dashboards."], ["Evals", "Offline metrics: rubric scores by category, instruction following rate, safety violation rate. Online metrics: draft acceptance rate, edit distance after acceptance, regenerate rate, retention of feature users, latency and cost. Regularly check that offline gains predict online gains; if not, the offline set needs to change."], ["Guardrails", "Release gates: a change cannot ship if any key offline metric regresses beyond a threshold. Online: alerts on safety reports, latency and cost; staged rollouts from 1% to 100%."], ["ROI", "A strong eval system makes iteration faster and safer: teams can test changes in hours instead of waiting for user complaints, and avoid costly regressions."]], "followup": "如果离线评测提升了，但线上指标没变化，可能是什么原因？", "followupAnswer": "Several possible reasons. First, the offline set doesn't represent real traffic: it might over-weight hard cases that users rarely send, so gains don't show up in practice. I'd compare the distribution of offline examples with a sample of real requests and refresh the set. Second, the judge or rubric rewards something users don't care about, such as longer answers. I'd check judge agreement with real user preferences. Third, the online metric isn't sensitive enough or the test is underpowered, so a real but small gain is hidden. Fourth, other factors like latency or UI changes offset the quality gain. I'd investigate each, then update the offline set so it better predicts online results."}];
const CATS=[...new Set(DATA.map(x=>x.category))];const KEY='pm_lab_v1';let db={favorites:{},notes:{},drafts:{},done:{},mastered:{},stories:[]};try{db={...db,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
let tab='learn',filter='',category='all',current=null,revealed=false;
const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),btn=(name,fn,cl='')=>`<button class="${cl}" onclick="${fn}">${name}</button>`;
const fold=(title,body,open=false,cls='')=>`<details class="${cls}"${open?' open':''}><summary>${title}</summary><div class="body">${body}</div></details>`;
function nav(){$('nav').innerHTML=[['learn','学习'],['practice','刷题'],['favorites','星标'],['progress','进度'],['stories','经历库']].map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="switchTab('${id}')">${t}</button>`).join('')}
function switchTab(t){tab=t;current=null;revealed=false;render()}
function picker(){return `<div class="toolbar"><input id="search" placeholder="搜索题目 / Search" value="${esc(filter)}" oninput="filter=this.value;renderList()"><select id="cat" onchange="category=this.value;renderList()"><option value="all">全部题型</option>${CATS.map(c=>`<option value="${esc(c)}" ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button onclick="randomQ()">随机一题</button></div><div id="list"></div>`}
function filtered(){const f=filter.toLowerCase();return DATA.filter(q=>(category==='all'||q.category===category)&&(q.question.toLowerCase().includes(f)||q.english.toLowerCase().includes(f))&&(tab!=='favorites'||db.favorites[q.id]))}
function tags(q){return (db.favorites[q.id]?'<i class="tag star">星标</i>':'')+(db.mastered[q.id]?'<i class="tag ok">已掌握</i>':db.done[q.id]?'<i class="tag done">已学习</i>':'')}
function renderList(){let a=filtered();$('list').innerHTML=`<h3>${a.length} 道题目</h3>${a.length?`<div class="question-list">${a.map(q=>`<button class="qrow" onclick="openQ(${q.id})">${q.id}. ${esc(q.question)}${tags(q)}<span>${esc(q.english)} · ${esc(q.category)}</span></button>`).join('')}</div>`:'<div class="empty">没有匹配的题目</div>'}`}
function randomQ(){let a=filtered();if(a.length)openQ(a[Math.floor(Math.random()*a.length)].id)}
function openQ(id){current=id;revealed=tab!=='practice';render();window.scrollTo(0,0)}
function updateNote(id,v){db.notes[id]=v;save()}function updateDraft(id,v){db.drafts[id]=v;save()}
function star(id){db.favorites[id]=!db.favorites[id];save();render()}function mark(id,k){db[k][id]=!db[k][id];save();render()}
function reveal(){let v=$('draft').value;if(!v.trim()){alert('请先输入你的回答，再解锁题解。');return}db.drafts[current]=v;db.done[current]=true;save();revealed=true;render()}
function answerText(q){return q.answer.map(([l,t])=>`${l}: ${t}`).join('\n\n')}
function questionView(){let q=DATA.find(x=>x.id===current);
let c=`<button class="plain" onclick="current=null;render()">‹ 返回题库</button><section class="card"><span class="pill">${esc(q.category)}</span><h2>${q.id}. ${esc(q.question)}</h2><p class="muted">${esc(q.english)}</p><div class="actions">${btn(db.favorites[q.id]?'已星标':'星标',`star(${q.id})`,db.favorites[q.id]?'on':'')}${btn(db.done[q.id]?'已学习':'标记已学习',`mark(${q.id},'done')`,db.done[q.id]?'on':'')}${btn(db.mastered[q.id]?'已掌握':'标记已掌握',`mark(${q.id},'mastered')`,db.mastered[q.id]?'on':'')}</div>${fold('我的笔记 / 星标原因',`<textarea placeholder="为什么收藏？哪些点容易漏？" oninput="updateNote(${q.id},this.value)">${esc(db.notes[q.id]||'')}</textarea>`,!!db.notes[q.id])}</section>`;
if(tab==='practice')c+=`<section class="card"><h2>先回答，再看题解</h2><p class="muted">建议按目标、分析、取舍、指标的结构作答；没有 AI 评分。</p><textarea id="draft" placeholder="Type your answer here / 输入自己的答案" oninput="updateDraft(${q.id},this.value)">${esc(db.drafts[q.id]||'')}</textarea><div class="actions">${btn(revealed?'已解锁':'提交回答并解锁','reveal()','primary')}</div></section>`;
if(revealed)c+=`<section class="card"><h2>题解 / Answer Guide</h2><p class="muted">点击展开查看详细内容</p>
${fold('结构化框架 · Framework',`<div class="hint"><b>中文：</b>${esc(q.frameworkZH)}<br><b>English:</b> ${esc(q.frameworkEN)}</div>`)}
${fold('解题思路 / Reasoning',`<ol class="steps">${q.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p>${esc(q.detail)}</p>`)}
${fold('指标与 ROI / Metrics',`<p>${esc(q.metrics)}</p><p class="muted">ROI 估算公式：（增量收益 − 开发、推理及运营成本）÷ 总成本。需要基线、时间窗口和假设，不要编造事实。</p>`)}
${fold('容易遗漏 / Common Pitfalls',`<ul class="steps">${q.pitfalls.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`)}
${fold('英文参考答案 / Sample Answer',`<div class="ans">${q.answer.map(([l,t])=>`<p><b>${esc(l)}</b>${esc(t)}</p>`).join('')}</div>${btn('复制英文答案',`copyAnswer(${q.id})`)}`)}
${fold('面试官追问 / Follow-up',`<p class="fq">${esc(q.followup)}</p>${fold('查看参考回答 / Sample Answer',`<p>${esc(q.followupAnswer)}</p>`,false,'inner')}`)}
<div class="actions">${btn('下一题',`nextQ(${q.id})`,'primary')}</div></section>`;return c}
function copyAnswer(id){let q=DATA.find(x=>x.id===id);navigator.clipboard?.writeText(answerText(q)).then(()=>alert('已复制')).catch(()=>alert('浏览器不支持复制'))}
function nextQ(id){let i=DATA.findIndex(q=>q.id===id);openQ(DATA[(i+1)%DATA.length].id)}
function progress(){let n=DATA.length,d=Object.values(db.done).filter(Boolean).length,m=Object.values(db.mastered).filter(Boolean).length,f=Object.values(db.favorites).filter(Boolean).length;return `<div class="stats" style="margin-top:12px"><div class="stat"><b>${d}/${n}</b><small>已学习</small></div><div class="stat"><b>${m}</b><small>已掌握</small></div><div class="stat"><b>${f}</b><small>星标题目</small></div></div><section class="card"><h2>题型掌握度</h2>${CATS.map(c=>{let a=DATA.filter(q=>q.category===c),done=a.filter(q=>db.mastered[q.id]).length;return `<p>${esc(c)} · ${done}/${a.length}</p><div class="progress"><div style="width:${done/a.length*100}%"></div></div>`}).join('')}</section><section class="card"><h2>备份与迁移</h2><p>下载进度、笔记和星标 JSON，换设备时可导入。题库内置在网页中。</p><div class="actions">${btn('导出数据','exportData()','primary')}<label class="chip">导入备份<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>${btn('重置筛选','resetFilters()')}</div></section>`}
function resetFilters(){filter='';category='all';render()}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pm-interview-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(el){let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v||typeof v!=='object')throw Error();db={...db,...v};save();render();alert('导入成功')}catch(e){alert('无效的备份文件')}};r.readAsText(el.files[0])}
function addStory(){let title=$('storytitle').value.trim(),desc=$('storydesc').value.trim();if(!title)return alert('请输入项目名称');db.stories.push({title,desc});save();render()}
function stories(){let examples=['基金 / ETF AI Search（InvestPal）','企业数据分析 Agent / ChatBI','多模态作品集评审','汽车语音助手 Demo','PRD Writing Skill / DeepSeek Harness','Watchlist 产品体验优化','个人 AI 产品项目'];return `<section class="card"><h2>个人经历库 · 待完善</h2><p>这里已预留你的项目方向，但<strong>不会编造实际经历和数据</strong>。后续可以将完整项目复盘导入并扩展为 STAR、技术深挖、指标追问和英文口述题。</p>${examples.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}<h3>新增项目</h3><input id="storytitle" placeholder="项目名称" style="margin-bottom:8px"><textarea id="storydesc" placeholder="背景、个人职责、方案、指标、结果、真实数据与待确认事项"></textarea><div class="actions">${btn('保存项目','addStory()','primary')}</div></section>${db.stories.map((s,i)=>`<section class="card"><h2>${esc(s.title)}</h2><p>${esc(s.desc)}</p>${btn('删除',`deleteStory(${i})`)}</section>`).join('')}`}
function deleteStory(i){if(confirm('删除此项目？')){db.stories.splice(i,1);save();render()}}
function render(){nav();$('app').innerHTML=current!==null?questionView():tab==='progress'?progress():tab==='stories'?stories():`<section class="card"><h2>${tab==='learn'?'学习模式':tab==='practice'?'刷题模式':'星标题库'}</h2><p class="muted">${tab==='practice'?'必须填写回答后才会显示答案。':tab==='favorites'?'只显示你收藏的题目与笔记。':'阅读中英文结构化思路与参考答案，内容默认收起，点开查看。'}</p></section>${picker()}`;if(current===null&&['learn','practice','favorites'].includes(tab))renderList()}
render();
</script></body></html>
